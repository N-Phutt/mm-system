<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2E33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maintenance">
<title>Maintenance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#EEF4F3; --surface:#FFFFFF; --surface-2:#F4F8F7; --ink:#0F2E33; --ink-2:#45605F; --ink-3:#748B8A;
  --line:#D3E0DE; --accent:#0E7C7B; --accent-soft:#DDF0EE; --accent-ink:#FFFFFF;
  --side:#0F2E33; --side-ink:#BFD6D4; --side-hi:#FFFFFF; --hazard:#F2B544;
  --ok:#2E8B57; --ok-soft:#E0F2E7; --warn:#B7791F; --warn-soft:#FDF1D8; --bad:#C0392B; --bad-soft:#FBE4E1;
  --info:#3A5FC0; --info-soft:#E4EAF9; --mute-soft:#E9EDF1;
  --shadow:0 1px 2px rgba(19,32,44,.06),0 4px 16px rgba(19,32,44,.06);
  --r:10px; --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1A1C; --surface:#112528; --surface-2:#16302F; --ink:#E2EFEE; --ink-2:#9DBAB8; --ink-3:#6E8C8A;
  --line:#22403F; --accent:#3CC2BE; --accent-soft:#11393A; --accent-ink:#04201F;
  --side:#081416; --side-ink:#9DBAB8; --side-hi:#FFFFFF;
  --ok:#4CC38A; --ok-soft:#12362A; --warn:#EDB94A; --warn-soft:#3A2D10; --bad:#F07A6E; --bad-soft:#3D1C19;
  --info:#7E9CF0; --info-soft:#1C2847; --mute-soft:#223040; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1A1C; --surface:#112528; --surface-2:#16302F; --ink:#E2EFEE; --ink-2:#9DBAB8; --ink-3:#6E8C8A;
  --line:#22403F; --accent:#3CC2BE; --accent-soft:#11393A; --accent-ink:#04201F;
  --side:#081416; --side-ink:#9DBAB8; --side-hi:#FFFFFF;
  --ok:#4CC38A; --ok-soft:#12362A; --warn:#EDB94A; --warn-soft:#3A2D10; --bad:#F07A6E; --bad-soft:#3D1C19;
  --info:#7E9CF0; --info-soft:#1C2847; --mute-soft:#223040; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
#root{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:calc(100vh / var(--z,1));min-height:calc(100dvh / var(--z,1));display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--side);color:var(--side-ink);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--side) 14px 28px)}
.login-art h1{color:#fff;font-size:clamp(26px,3.4vw,38px);font-weight:700;max-width:16ch}
.login-art p{max-width:46ch}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand-mark{width:38px;height:38px;border-radius:8px;background:var(--hazard);display:grid;place-items:center;color:#0F2E33;font:700 14px var(--mono)}
.brand small{display:block;color:var(--side-ink);font-size:12px}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px}
.kpi-strip div{border:1px solid #1F4A4E;border-radius:8px;padding:12px}
.kpi-strip b{display:block;color:#fff;font:600 18px var(--mono)}
.login-form{display:grid;place-items:center;padding:32px 16px;background:var(--bg)}
.login-card{width:100%;max-width:380px;display:grid;gap:18px}
.login-card .foot{font-size:12px;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:20px;padding:20px 12px;position:sticky;top:0;height:calc(100vh / var(--z,1))}
.side .brand{padding:0 8px}
.nav{display:grid;gap:2px;align-content:start;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px;scrollbar-width:thin;scrollbar-color:#2C5A5E transparent}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:#2C5A5E;border-radius:3px}
.side{overflow:hidden}
.side .brand,.side .me{flex:none}
@media (max-height:820px){.side{gap:12px;padding-top:14px;padding-bottom:12px}.nav a{padding:7px 12px}.side .me{padding-top:10px}}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:#0E7C7B;color:#fff;box-shadow:inset 3px 0 0 var(--hazard)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--hazard);color:#0F2E33;border-radius:99px;padding:0 7px;font:600 11px/18px var(--mono)}
.side .me{margin-top:auto;border-top:1px solid #1F4A4E;padding:14px 8px 0;display:grid;gap:6px;font-size:13px}
.side .me b{color:#fff;font-weight:600}
.side .me button{background:none;border:1px solid #2B5A5E;color:var(--side-ink);border-radius:6px;padding:5px 10px;cursor:pointer;justify-self:start}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.topbar .grow{flex:1}
.content{padding:24px;display:grid;gap:20px;align-content:start}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head p{margin:4px 0 0;color:var(--ink-2)}

/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg,.qchip svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:grid;gap:5px}
.field > span{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;min-height:38px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .v{font:600 26px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tile .v small{font:500 13px var(--font);color:var(--ink-2);margin-left:4px}
.tile .s{font-size:12px;color:var(--ink-2)}
.tile.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:linear-gradient(var(--bad-soft),var(--bad-soft)) top/100% 3px no-repeat,var(--surface)}
.tile.warn{background:linear-gradient(var(--warn),var(--warn)) top/100% 3px no-repeat,var(--surface)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.card table th{background:none}
.card .tbl-wrap{border:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.plain::before{display:none}
.st-new{background:var(--info-soft);color:var(--info)}
.st-assigned{background:var(--accent-soft);color:var(--accent)}
.st-in_progress{background:var(--warn-soft);color:var(--warn)}
.st-on_hold{background:var(--mute-soft);color:var(--ink-2)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-closed{background:var(--mute-soft);color:var(--ink-3)}
.st-cancelled{background:var(--mute-soft);color:var(--ink-3);text-decoration:line-through}
.pr{font:600 11px var(--mono);letter-spacing:.03em;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.pr-urgent{color:var(--bad);background:var(--bad-soft)}
.pr-high{color:var(--warn)}
.pr-medium{color:var(--accent)}
.pr-low{color:var(--ink-3)}
.sla{font:500 12px var(--mono);white-space:nowrap}
.sla.ok{color:var(--ok)} .sla.warn{color:var(--warn)} .sla.bad{color:var(--bad);font-weight:600}
.down{color:var(--bad);font-size:12px;font-weight:600;white-space:nowrap}
.team-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;margin-bottom:-1px}
.tabs button.on{border-color:var(--accent);color:var(--ink)}
.tabs .c{font:500 11px var(--mono);color:var(--ink-3);margin-left:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .input{width:auto;min-width:150px}
.toolbar .search{flex:1;min-width:200px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:var(--mute-soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font:10px var(--mono)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* panel (drawer) */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.panel-body{overflow-y:auto;padding:20px;display:grid;gap:16px;align-content:start;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline .t{font-size:12px;color:var(--ink-3)}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:30}
.combo-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.combo-list button:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.vq-h{font-size:16px;margin:6px 0 -4px}
.rq-list{display:grid;gap:12px}
.rq-card{cursor:pointer;display:grid;gap:8px}.rq-card:hover{border-color:var(--accent)}
.rq-card h3{margin:0;font-size:16px}
.rq-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rq-steps span{line-height:1.25}
@media (max-width:560px){.rq-steps li{font-size:10.5px}}
.rq-steps{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rq-steps li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;color:var(--ink-3,#888);position:relative}
.rq-steps li:not(:last-child)::after{content:'';position:absolute;top:12px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--line)}
.rq-steps li.done:not(:last-child)::after{background:var(--accent)}
.rq-steps i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:12px}
.rq-steps li.done i{background:var(--accent);border-color:var(--accent);color:#fff}
.rq-steps li.now{color:var(--ink);font-weight:600}.rq-steps li.now i{border-color:var(--accent);color:var(--accent)}
.note.vf-stage{border:1px solid var(--ok,#16a34a);border-style:solid}
.note.warn{border:1px solid var(--warn,#d97706);background:color-mix(in srgb,var(--warn,#d97706) 10%,transparent);color:var(--ink);gap:10px;flex-wrap:wrap}
.checklist{margin:0;padding-left:20px}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.swatch{width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}


/* ---------- header, form, tech, calendar, reports ---------- */
.crumb-wrap{display:grid;line-height:1.25;min-width:0}
.crumb-wrap small{font-size:11.5px;color:var(--ink-3)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn svg{width:17px;height:17px}
.bc{display:flex;gap:8px;color:var(--ink-3)} .bc a{text-decoration:none}
.nf-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.nf-grid h2{margin-bottom:2px}
.nf-side{position:sticky;top:84px}
.nf-actions .btn.primary{flex:1}
.nf-actions svg{width:16px;height:16px}
.req{color:var(--bad);font-style:normal}
.hint{font-size:11.5px;color:var(--ink-3)} .hint b{color:var(--accent);font-weight:500}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tech-head{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:16px}
.tech-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.tech-kv div{background:var(--surface-2);border-radius:8px;padding:8px}
.tech-kv dt{font-size:11px;color:var(--ink-3)} .tech-kv dd{margin:0;font-weight:600}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px;min-width:700px}
.cal-h{background:var(--surface-2);padding:8px;font-size:12px;font-weight:600;color:var(--ink-2);text-align:center}
.cal-c{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-c.out{background:var(--surface-2)} .cal-c.out .cal-d{color:var(--ink-3)}
.cal-d{font:500 12px var(--mono);align-self:flex-end;padding:1px 6px;border-radius:99px}
.cal-c.today .cal-d{background:var(--accent);color:var(--accent-ink)}
.chip{border:0;text-align:left;font-size:11px;line-height:1.35;padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.c-pm{background:var(--ok-soft);color:var(--ok)} .c-hot{background:var(--bad-soft);color:var(--bad)} .c-wo{background:var(--accent-soft);color:var(--accent)} .c-done{background:var(--mute-soft);color:var(--ink-3);text-decoration:line-through}
.rep-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
table.rep td,table.rep th{padding:8px 10px;font-size:12.5px}
table.rep th.num,table.rep td.num{text-align:right}
table.rep tr.tot td{font-weight:600;background:var(--surface-2)}
@media (max-width:1100px){.nf-grid{grid-template-columns:1fr}.nf-side{position:static}.rep-grid{grid-template-columns:1fr}}


.kpi-of{font-size:16px;color:var(--ink-3)}
.pm-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}

/* QR print */
.print-area{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:16px}
.print-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:16px;position:sticky;top:0}
.labels{display:grid;gap:4mm;background:#fff;color:#000;padding:8mm;width:210mm;margin:0 auto}
.labels.m{grid-template-columns:repeat(3,1fr)}
.labels.l{grid-template-columns:repeat(2,1fr)}
.labels.s{grid-template-columns:repeat(4,1fr)}
.lbl{border:1px dashed #999;border-radius:2mm;padding:2.5mm;display:flex;gap:2.5mm;align-items:center;break-inside:avoid;height:34mm;overflow:hidden}
.labels.l .lbl{height:62mm;padding:4mm;gap:4mm}
.labels.s .lbl{height:22mm;padding:1.5mm;gap:1.5mm}
.lbl-qr{flex:none;width:28mm;height:28mm}
.labels.l .lbl-qr{width:50mm;height:50mm}
.labels.s .lbl-qr{width:18mm;height:18mm}
.lbl-qr svg{width:100%;height:100%;display:block}
.lbl-t{display:grid;gap:.6mm;min-width:0;font-size:8pt;line-height:1.2}

.labels.l .lbl-t{font-size:11pt}.labels.l .lbl-t b{font-size:16pt}
.labels.s .lbl-t{font-size:6.5pt}.labels.s .lbl-t b{font-size:8.5pt}
.lbl-t span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lbl-foot{color:#555;font-size:.85em}
.lbl-crit{border:1.2mm solid #C0392B}
@media print{
  @page{size:A4;margin:0}
  body.printing > *:not(#printArea){display:none!important}
  body.printing .print-area{position:static;padding:0;background:#fff}
  body.printing .no-print{display:none!important}
  body.printing .labels{padding:8mm;width:auto}
}

function slaTag(w){
  if (!w.sla_resolve_due) return '<span class="muted small">–</span>';
  const due = new Date(w.sla_resolve_due).getTime();
  if (w.completed_at){
    const met = new Date(w.completed_at).getTime() <= due;
    return `<span class="sla ${met?'ok':'bad'}">${met?'ทัน SLA':'เกิน SLA'}</span>`;
  }
  if (!OPEN.includes(w.status)) return '<span class="muted small">–</span>';
  const left = (due - Date.now())/36e5;
  const total = (due - new Date(w.created_at).getTime())/36e5;
  if (left < 0) return `<span class="sla bad">เกิน ${dur(-left)}</span>`;
  return `<span class="sla ${left < total*0.25 ? 'warn':'ok'}">เหลือ ${dur(left)}</span>`;
}

function toast(msg, err=false){
  const t = document.createElement('div'); t.className = 'toast'+(err?' err':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:2600);
}
function fail(e){ console.error(e); toast(thaiErr(e), true); }
function thaiErr(e){
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  if (/foreign key/i.test(m)) return 'ลบไม่ได้ เพราะยังมีข้อมูลอื่นอ้างอิงอยู่';
  if (/banned/i.test(m)) return 'บัญชีนี้ถูกปิดใช้งาน ติดต่อผู้ดูแลระบบ';
  if (/not authorized|permission|row-level/i.test(m)) return 'คุณไม่มีสิทธิ์ทำรายการนี้';
  if (/duplicate key/i.test(m)) return 'รหัสนี้มีอยู่แล้ว กรุณาใช้รหัสอื่น';
  if (/Failed to fetch/i.test(m)) return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง';
  return m;
}

const ZOOM_OK = typeof CSS!=='undefined' && CSS.supports && CSS.supports('zoom','1');
const ZOOM_STEPS = ['auto', 0.8, 0.9, 1, 1.1];
let zoomPref = 'auto';
try { const z = localStorage.getItem('emm.zoom'); if (z && z!=='auto' && ZOOM_STEPS.includes(+z)) zoomPref = +z; } catch {}
function autoZoom(){
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 861) return 1;
  let z = w < 1300 ? 0.85 : w < 1600 ? 0.9 : 1;
  if (h < 620) z = Math.min(z, 0.85);
  return z;
}
function applyZoom(){
  if (!ZOOM_OK) return;
  const z = window.innerWidth < 861 ? 1 : (zoomPref==='auto' ? autoZoom() : zoomPref);
  const el = document.documentElement;
  el.style.zoom = z===1 ? '' : String(z);
  el.style.setProperty('--z', String(z));
}
applyZoom();
let zoomRaf = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(zoomRaf); zoomRaf = requestAnimationFrame(applyZoom); });
let booting = false;
async function boot(){
  if (booting) return;
  if (/^#(report|asset\/)/.test(location.hash)) {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { await loadCfg(); const m = location.hash.match(/^#(report|asset)\/(.+)$/);
      if (location.hash.startsWith('#asset/')) return renderPublicAsset(decodeURIComponent(m[2]));
      return renderPublicReport(m ? decodeURIComponent(m[2]) : ''); }
  }
  booting = true;
  try { await bootInner(); } finally { booting = false; }
}
async function bootInner(){
  await loadCfg();
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session;
  if (!session) return renderLogin();
  try {
    const { data } = await q(sb.from('profiles').select('*').eq('id', session.user.id).single());
    S.profile = data;
    S.perms = new Set((await sb.rpc('my_perms')).data || []);
    if (!data.active) { await sb.auth.signOut(); return renderLogin('บัญชีนี้ถูกปิดการใช้งาน'); }
    await loadRefs();
    renderShell();
  } catch (e) { fail(e); renderLogin(thaiErr(e)); }
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_IN' && !S.profile) { S.session = session; boot(); }
  if (ev === 'SIGNED_OUT') { S.session=null; S.profile=null; renderLogin(); }
});

async function loadRefs(){
  const [t,p,l] = await Promise.all([
    sb.from('teams').select('*').order('sort_order').order('name'),
    sb.from('profiles').select('id,full_name,username,role,team_id,active,department,phone').order('full_name'),
    sb.from('locations').select('id,code,name,building,floor,active,sort_order').order('sort_order').order('name')
  ]);
  S.teams = t.data||[]; S.people = p.data||[]; S.locations = l.data||[];
  S.sla = (await sb.from('sla_policies').select('*')).data || [];
  S.eqTypes = (await sb.from('equipment_types').select('*').order('sort_order').order('name')).data || [];
}

function route(){
  if (location.hash === '#report') { location.hash = '#new'; return; }
  clearInterval(boardTimer);
  const hr = location.hash.slice(1);
  if (!hr.startsWith('board') && document.body.classList.contains('tv')) { document.body.classList.remove('tv'); if (document.fullscreenElement) document.exitFullscreen?.().catch(()=>{}); }
  const am = hr.match(/^(asset|report)\/(.+)$/);

    const code = decodeURIComponent(am[2]); closeSide(); closePanel();
    if (am[1]==='report' && can('wo.create')) {
      S.route='new'; $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r==='new')); $$('#bnav [data-bn]').forEach(a=>a.classList.toggle('on', a.dataset.bn==='new'));

      sb.from('equipment').select('id,asset_code,name,location_id').eq('asset_code', code).maybeSingle().then(({data}) => PAGES.new(data||null)).catch(fail);
      return;
    }

    $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r==='equipment')); $$('#bnav [data-bn]').forEach(a=>a.classList.remove('on'));
    $('#crumb').textContent = CRUMB.asset[0]; $('#crumb2').textContent = code;
    $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>';
    if (!(can('asset.view')||can('asset.manage')||can('wo.edit'))) { $('#view').innerHTML = `<section class="card"><div class="empty">คุณไม่มีสิทธิ์ดูรายละเอียดเครื่อง<br>${can('wo.create')?`<a class="btn primary" href="#report/${encodeURIComponent(code)}" style="margin-top:12px">แจ้งซ่อมเครื่อง ${esc(code)}</a>`:''}</div></section>`; return; }
    PAGES.asset(code).catch(fail); return;
  }
  const r = (hr || (isReq() ? 'requests' : 'dashboard'));
  const n = NAV.find(n=>n[0]===r && n[2]()) || NAV.find(n=>n[0]===(isReq()?'requests':'dashboard') && n[2]()) || NAV.find(n=>n[2]()) || NAV[0];
  S.route = n[0]; closeSide(); closePanel();
  $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r===n[0]));

  $('#nav a.on')?.scrollIntoView({block:'nearest'});
  $('#crumb').textContent = (CRUMB[n[0]]||[n[1]])[0]; $('#crumb2').textContent = (CRUMB[n[0]]||['',''])[1];
  $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>';
  PAGES[n[0]]().catch(fail);
}

function bindEquipCombo(id, onPick){

function kpi(icon, label, value, unit, sub, tone){
  return `<div class="kpi"><span class="kpi-ic tone-${tone}">${svgI(icon)}</span><div class="kpi-b"><span class="kpi-l">${label}</span>
    <span class="kpi-v tone-t-${tone}">${value}${unit?`<small>${unit}</small>`:''}</span><span class="kpi-s">${sub||'&nbsp;'}</span></div></div>`;
}
function delta(cur, prev, unit, higherBetter, txt){
  if (cur==null || prev==null) return `<span class="muted">ยังไม่มีข้อมูลช่วงก่อนหน้าให้เทียบ</span>`;
  const df_ = cur - prev; if (Math.abs(df_) < 0.05) return `<span class="muted">เท่าเดิม ${txt}</span>`;
  const good = higherBetter ? df_>0 : df_<0;
  return `<span style="color:${good?'var(--ok)':'var(--bad)'}">${df_>0?'↑':'↓'} ${fmtN(Math.abs(df_),1)} ${unit}</span> <span class="muted">${txt}</span>`;
}
function timeAgo(t){
  const m = (Date.now() - new Date(t).getTime())/6e4;
  if (m < 60) return Math.max(1,Math.round(m))+' นาที';
  if (m < 1440) return Math.round(m/60)+' ชม.';
  return Math.round(m/1440)+' วัน';
}
function donut(segs, center, sub, centerColor){
  const R=42, C=2*Math.PI*R; const tot = segs.reduce((a,s)=>a+s.v,0);
  let off=0, arcs='';
  if (tot>0) segs.filter(s=>s.v>0).forEach(s=>{ const len=s.v/tot*C; arcs += `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${s.c}" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off+=len; });
  return `<svg class="donut" viewBox="0 0 120 120" role="img"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--mute-soft)" stroke-width="14"/>${arcs}
    <text x="60" y="60" text-anchor="middle" class="dn-v" style="fill:${centerColor||'var(--ink)'}">${esc(center)}</text><text x="60" y="76" text-anchor="middle" class="dn-l">${esc(sub)}</text></svg>`;
}
function hbars(rows, color, emptyTxt){
  if (!rows?.length) return `<div class="empty">${emptyTxt}</div>`;
  const max = Math.max(...rows.map(r=>r.n));
  return `<div class="hbars">${rows.map(r=>`<div class="hb"><span class="hb-l" title="${esc(r.name)}">${esc(r.name)}</span><div class="hb-t"><i style="width:${r.n/max*100}%;background:${color}"></i></div><b class="mono">${r.n}</b></div>`).join('')}</div>`;
}
function lineChart(labels, series, rows, monthly){
  const W=420,H=190,L=28,R=10,T=12,B=26, iw=W-L-R, ih=H-T-B;
  const vals = rows.flatMap(r=>series.map(s=>Number(r[s.k])||0));
  const max = Math.max(monthly?1:4, ...vals); const step = monthly ? Math.max(0.5, Math.ceil(max/4*2)/2) : Math.ceil(max/4); const top = step*4;
  const x = i => L + (labels.length<2 ? iw/2 : i*iw/(labels.length-1));
  const y = v => T + ih - v/top*ih;
  let g='';
  for (let i=0;i<=4;i++){ const v=step*i; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${i?'3 3':''}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fmtN(v,1)}</text>`; }
  const every = monthly ? 1 : 2;
  labels.forEach((l,i)=>{ if (i%every===0 || i===labels.length-1) { const t = monthly ? new Intl.DateTimeFormat('th-TH',{month:'short'}).format(new Date(l+'-01T00:00:00')) : (()=>{const dd=new Date(l+'T00:00:00');return dd.getDate()+'/'+(dd.getMonth()+1);})(); g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${t}</text>`; } });
  series.forEach(s=>{
    const pts = rows.map((r,i)=>[x(i), r[s.k]==null?null:y(Number(r[s.k]))]).filter(p=>p[1]!=null);
    if (!pts.length) return;
    const dpath = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    g += `<path d="${dpath} L${pts[pts.length-1][0]} ${T+ih} L${pts[0][0]} ${T+ih}Z" fill="${s.c}" opacity=".08"/>`;
    g += `<path d="${dpath}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ g += `<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?3.5:2.2}" fill="${s.c}"/>`; });
  });
  if (!vals.some(v=>v>0)) g += `<text x="${L+iw/2}" y="${T+ih/2}" text-anchor="middle" style="font-size:11px">ยังไม่มีข้อมูลในช่วงนี้</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function pctBar(p){ const c = p>=90?'ok':p>=70?'warn':'bad'; return `<div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i class="${c}" style="width:${p}%"></i></div><span class="mono small num" style="width:42px;text-align:right">${fmtN(p,0)}%</span></div>`; }

function dailyChart(rows){
  rows = rows||[]; if (!rows.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  const W=640,H=220,L=32,R=8,T=10,B=26, iw=W-L-R, ih=H-T-B;
  const max = Math.max(4, ...rows.map(r=>Math.max(r.created,r.completed)));
  const step = Math.ceil(max/4); const top = step*4;
  const bw = iw/rows.length; const gap = Math.min(3, bw*0.2); const b = Math.max(1,(bw-gap*2)/2);
  const y = v => T + ih - v/top*ih;
  let g = '';
  for (let i=0;i<=4;i++){ const v=step*i; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`; }
  const every = Math.ceil(rows.length/8);
  rows.forEach((r,i)=>{
    const x = L + i*bw + gap;
    g += `<rect x="${x}" y="${y(r.created)}" width="${b}" height="${ih - (y(r.created)-T)}" fill="var(--ink-3)" opacity=".55"><title>${fmtD(r.d)} แจ้ง ${r.created}</title></rect>`;
    g += `<rect x="${x+b}" y="${y(r.completed)}" width="${b}" height="${ih - (y(r.completed)-T)}" fill="var(--accent)"><title>${fmtD(r.d)} เสร็จ ${r.completed}</title></rect>`;
    if (i%every===0) { const dd=new Date(r.d+'T00:00:00'); g += `<text x="${x+b}" y="${H-8}" text-anchor="middle">${dd.getDate()}/${dd.getMonth()+1}</text>`; }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟงานรายวัน">${g}</svg>`;
}

      q(sb.from('work_orders').select('*,equipment:equipment_id(id,asset_code,name,category,model,manufacturer,criticality),location:location_id(name,building,floor),team:team_id(id,name,color),assignee:profiles!work_orders_assigned_to_fkey(full_name),reporter:profiles!work_orders_reported_by_fkey(full_name),verifier:profiles!work_orders_verified_by_fkey(full_name)').eq('id',id).single()),
      q(sb.from('work_order_events').select('*,actor:profiles!work_order_events_actor_id_fkey(full_name)').eq('work_order_id',id).order('created_at')),
      !seesWork() ? {data:[]} : q(sb.from('work_order_parts').select('id,quantity_used,used_at,part:part_id(part_code,name,unit,unit_cost)').eq('work_order_id',id).order('used_at'))
    ]);

    let checklist = null;
    if (w.pm_schedule_id) { const r = await sb.from('pm_schedules').select('checklist').eq('id',w.pm_schedule_id).maybeSingle(); checklist = r.data?.checklist; }
    const [pr, kids, par] = await Promise.all([
      checklist?.length ? sb.from('pm_results').select('idx,item,result,value,unit,note').eq('work_order_id', id) : {data:[]},
      sb.from('work_orders').select('id,code,status').eq('parent_id', id),
      w.parent_id ? sb.from('work_orders').select('id,code,status').eq('id', w.parent_id).maybeSingle() : {data:null}
    ]);
    w._results = pr.data || []; w._kids = kids.data || []; w._parent = par.data || null;
    renderWO(w, ev||[], parts||[], checklist);
  } catch(e){ closePanel(); fail(e); }
}

function slaFor(priority, team){
  const pol = (S.sla||[]).find(x=>x.priority===priority && x.team_id===team) || (S.sla||[]).find(x=>x.priority===priority && !x.team_id);
  return pol ? `SLA อัตโนมัติ: <b>ต้องรับงานภายใน ${dur(Number(pol.response_hours))} · ซ่อมเสร็จภายใน ${dur(Number(pol.resolve_hours))}</b>` : 'ยังไม่ได้ตั้ง SLA สำหรับความเร่งด่วนนี้';
}

      toast('สร้างใบงาน '+data.code+' แล้ว'+(pick.files.length?` · แนบ${mediaWord(pick.files)}`:'')); refreshOpenCount();
      location.hash = isReq() ? '#requests' : row.source==='pm' ? '#wo' : '#repair'; setTimeout(()=>openWO(data.id), 300);
    } catch(err){ fail(err); btn.disabled=false; }
  };
};

  assigned:   { t:'ช่างรับงานแล้ว',     d:'รอเริ่มซ่อม',                     c:'accent', step:2 },
  in_progress:{ t:'กำลังซ่อม',          d:'ช่างกำลังดำเนินการ',             c:'warn',   step:3 },
  on_hold:    { t:'รออะไหล่ / พักงาน',  d:'งานหยุดชั่วคราว',                 c:'warn',   step:3 },
  done:       { t:'ซ่อมเสร็จ',          d:'รอวิศวกรตรวจรับ',                c:'violet', step:4 },
  closed:     { t:'เสร็จเรียบร้อย',     d:'ตรวจรับและปิดงานแล้ว',           c:'ok',     step:5 },

const REQ_TABS = [['open','กำลังดำเนินการ',w=>!['closed','cancelled'].includes(w.status)],['new','รอรับเรื่อง',w=>w.status==='new'],
  ['doing','กำลังซ่อม',w=>['assigned','in_progress','on_hold'].includes(w.status)],['done','รอตรวจรับ',w=>w.status==='done'],
  ['closed','เสร็จแล้ว',w=>['closed','cancelled'].includes(w.status)],['all','ทั้งหมด',()=>true]];
PAGES.requests = async () => {
  const f = reqFilter;

    .eq('reported_by', uid()).order('created_at', { ascending:false }).limit(200));

  const cnt = k => all.filter(REQ_TABS.find(t=>t[0]===k)[2]).length;
  const lastAt = w => [w.verified_at,w.completed_at,w.assigned_at,w.updated_at,w.created_at].filter(Boolean).sort().pop();
  const row = w => { const m = REQ_ST[w.status] || REQ_ST.new; const tech = w.assignee;

      <span class="rq-badge rq-${m.c}"><b>${m.t}</b><small>${m.d}</small></span>
      <div class="rq-main">
        <div class="rq-title">${w.equipment_down?'<span class="rq-down">เครื่องหยุด</span>':''}${esc(w.title)}</div>
        <div class="small muted">${[esc(w.code), w.equipment?esc(w.equipment.name):'', esc(w.location?.name||''), 'แจ้ง '+fmtD(w.created_at)].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="rq-tech">${tech?`<span class="avatar sm">${esc(shortName(tech.full_name).slice(0,1))}</span><div><b>${esc(shortName(tech.full_name))}</b>${tech.phone?`<a class="small" href="tel:${esc(tech.phone)}" onclick="event.stopPropagation()">📞 ${esc(tech.phone)}</a>`:''}</div>`:'<span class="small muted">— รอมอบหมายช่าง</span>'}</div>
      <div class="rq-prog">${m.step?`<div class="rq-dots">${[1,2,3,4,5].map(i=>`<i class="${i<=m.step?'on':''}"></i>`).join('')}</div><small class="muted">อัปเดต ${timeAgo(lastAt(w))}ที่แล้ว</small>`:''}</div>
    </li>`; };
  $('#view').innerHTML = `
  <div class="page-head"><div><h1>งานที่ฉันแจ้ง</h1><p>ติดตามสถานะงานซ่อมที่คุณแจ้งไว้ · กดที่รายการเพื่อดูรายละเอียดหรือพิมพ์สอบถามช่าง</p></div>
    <a class="btn primary" href="#new">${svgI('plus')} แจ้งซ่อมใหม่</a></div>
  <div class="rq-tabs">${REQ_TABS.map(([k,l])=>`<button class="rq-tab ${f.st===k?'on':''}" data-rqs="${k}"><span>${l}</span><b>${cnt(k)}</b></button>`).join('')}</div>
  ${list.length ? `<section class="card rq-card-list"><ul class="rq-list2">${list.map(row).join('')}</ul></section>`
    : `<section class="card"><div class="empty">${f.st==='open'?'ไม่มีงานที่กำลังดำเนินการ 👍':'ไม่มีรายการในหมวดนี้'}<br><a class="btn primary" href="#new" style="margin-top:10px">${svgI('plus')} แจ้งซ่อม</a></div></section>`}
  <p class="small muted rq-legend">ขั้นตอน: แจ้งซ่อม → ช่างรับงาน → กำลังซ่อม → ซ่อมเสร็จ รอตรวจรับ → เสร็จเรียบร้อย</p>`;
  $$('[data-rqs]').forEach(b=>b.onclick=()=>{ f.st=b.dataset.rqs; PAGES.requests().catch(fail); });
  $$('.rq-row').forEach(c=>{ c.onclick=()=>openWO(c.dataset.wo); c.onkeydown=e=>{ if(e.key==='Enter') openWO(c.dataset.wo); }; });
};

      <div class="grid2">
        <label class="field"><span>ชื่อผู้แจ้ง *</span><input class="input" id="pf-name" name="name" required></label>
        <label class="field"><span>เบอร์ติดต่อ / หน่วยงาน</span><input class="input" id="pf-contact" name="contact"></label>
      </div>
      ${photoPicker('pf-photos')}
      <label class="check"><input type="checkbox" id="pf-down"> เครื่องหยุดทำงาน</label>

    const desc = [f.asset && !eq ? 'รหัสอุปกรณ์ที่แจ้ง: '+f.asset : null, f.desc].filter(Boolean).join('\n');
    const id = crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
    const msg = (t, ok) => { $('#pf-msg').style.color = ok ? 'var(--ok)' : 'var(--bad)'; $('#pf-msg').textContent = t; };

    msg('ส่งแจ้งซ่อมเรียบร้อย ทีมช่างได้รับเรื่องแล้ว' + (nPh && !photoErr ? ` · แนบ${mediaWord(sent)}` : '') + photoErr, !photoErr);
  };
}

/* ============ PM ============ */
const pmFilter = { term:'', team:'', rec:'', st:'', quick:'' };
PAGES.pm = async () => {
  const f = pmFilter;
  const t0 = today(), t7 = today(7), mStart = t0.slice(0,8)+'01';
  const mStartIso = new Date(mStart+'T00:00:00+07:00').toISOString();
  const [{data:plans},{data:pmw}] = await Promise.all([
    q(sb.from('pm_schedules').select('*,equipment:equipment_id(id,asset_code,name,location:location_id(name)),assignee:profiles!pm_schedules_default_assignee_fkey(full_name),team:team_id(id,name,color)').order('next_due_date')),
    q(sb.from('work_orders').select('id,pm_schedule_id,status,due_date,completed_at').eq('source','pm').neq('status','cancelled').or(`status.in.(new,assigned,in_progress,on_hold),completed_at.gte.${new Date(Date.now()-400*864e5).toISOString()},due_date.gte.${mStartIso}`).limit(10000))
  ]);
  const dayOf = t => t ? new Date(t).toLocaleDateString('en-CA',{timeZone:TZ}) : null;
  const lastDone = {}; const openBy = {};
  pmw.forEach(w=>{ if (w.completed_at && (!lastDone[w.pm_schedule_id] || w.completed_at > lastDone[w.pm_schedule_id])) lastDone[w.pm_schedule_id] = w.completed_at;
    if (OPEN.includes(w.status)) (openBy[w.pm_schedule_id] = openBy[w.pm_schedule_id]||[]).push(w); });
  const active = plans.filter(p=>p.active);
  const todayW = pmw.filter(w=>dayOf(w.due_date)===t0);
  const overdueW = pmw.filter(w=>OPEN.includes(w.status) && w.due_date && dayOf(w.due_date) < t0);
  const overduePlans = active.filter(p=>p.next_due_date < t0);
  const overdueN = overdueW.length + overduePlans.length;
  const due7 = active.filter(p=>p.next_due_date >= t0 && p.next_due_date <= t7).length;
  const closedMonth = pmw.filter(w=>w.completed_at && dayOf(w.completed_at) >= mStart).length;
  const dueMonth = pmw.filter(w=>w.due_date && dayOf(w.due_date) >= mStart && dayOf(w.due_date) <= t0);
  const compliance = dueMonth.length ? dueMonth.filter(w=>w.completed_at && w.completed_at <= w.due_date).length / dueMonth.length * 100 : null;
  const planState = p => !p.active ? 'off' : (openBy[p.id]?.some(w=>dayOf(w.due_date) < t0) || p.next_due_date < t0) ? 'overdue' : p.next_due_date <= t7 ? 'soon' : 'on';
  let rows = plans.filter(p=>{
    if (f.term) { const s=f.term.toLowerCase(); if (![p.code,p.name,p.equipment?.asset_code,p.equipment?.name].some(v=>(v||'').toLowerCase().includes(s))) return false; }
    if (f.team && p.team_id !== f.team) return false;
    if (f.rec && p.recurrence_type !== f.rec) return false;
    const stt = planState(p);
    if (f.st==='active' && !p.active) return false; if (f.st==='off' && p.active) return false;
    if (f.st==='overdue' && stt!=='overdue') return false;
    if (f.quick==='overdue' && stt!=='overdue') return false;
    if (f.quick==='today' && !(openBy[p.id]||[]).some(w=>dayOf(w.due_date)===t0) && p.next_due_date!==t0) return false;
    return true; });
  const ST = { on:['เปิดใช้งาน','st-done'], soon:['ใกล้ถึงกำหนด','st-in_progress'], overdue:['เลยกำหนด','st-cancelled-bad'], off:['ปิดใช้งาน','st-closed'] };
  $('#view').innerHTML = `
  <div class="page-head"><div><h1>แผนบำรุงรักษาเชิงป้องกัน (PM)</h1><p>${fmtN(plans.length,0)} แผน · เปิดใช้งาน ${fmtN(active.length,0)} แผน · เรียงตามวันครบกำหนดถัดไป</p></div>
    ${can('pm.manage')?`<div class="row"><button class="btn" id="pmGen" title="สร้างใบงานให้แผนที่ครบกำหนดภายใน ${S.cfg.targets.pm_ahead_days} วัน">↻ สร้างงานล่วงหน้า</button><button class="btn primary" id="pmNew">+ สร้างแผนใหม่</button></div>`:''}</div>
  <section class="kpis">
    ${kpi('pm','แผนที่เปิดใช้งาน', `${active.length} <span class="kpi-of">/ ${plans.length}</span>`, '', 'แผนทั้งหมดในระบบ', 'accent')}
    ${kpi('check','งาน PM วันนี้', `${todayW.filter(w=>w.completed_at).length} <span class="kpi-of">/ ${todayW.length}</span>`, '', 'เสร็จแล้ว / ทั้งหมด', 'ok')}
    ${kpi('clock','เลยกำหนด', overdueN, '', `แผนยังไม่สร้างงาน ${overduePlans.length} · งานค้าง ${overdueW.length}`, overdueN?'bad':'ok')}
    ${kpi('calendar','ครบกำหนดใน 7 วัน', due7, '', 'แผนที่ต้องเตรียมงาน', 'info')}
    ${kpi('check','ปิดงานเดือนนี้', closedMonth, '', 'ใบงาน PM ที่ทำเสร็จ', 'ok')}
    ${kpi('sla','PM Compliance', compliance==null?'–':fmtN(compliance,1), compliance==null?'':'%', 'ทำเสร็จทันกำหนดในเดือนนี้', 'violet')}
  </section>
  <section class="filterbar">
    <div class="pm-top">
      <div class="row">
        <button class="qchip ${f.quick==='today'?'on':''}" data-quick="today">${svgI('check')} งาน PM วันนี้ <b>${todayW.length}</b></button>
        <button class="qchip ${f.quick==='overdue'?'on':''}" data-quick="overdue">${svgI('clock')} เลยกำหนด <b>${overdueN}</b></button>
        <a class="qchip" href="#calendar">${svgI('calendar')} ปฏิทินงาน</a>
      </div>
    </div>
    <div class="pm-filters">
      <label class="field"><span>ค้นหา</span><input class="input" id="pf-term" placeholder="รหัสแผน / ชื่อแผน / อุปกรณ์" value="${esc(f.term)}"></label>
      <label class="field"><span>ทีม</span><select class="input" id="pf-team">${teamOptions(f.team,'ทุกทีม')}</select></label>
      <label class="field"><span>รอบความถี่</span><select class="input" id="pf-rec"><option value="">ทุกรอบความถี่</option>${Object.entries(RECUR).map(([k,v])=>`<option value="${k}" ${k===f.rec?'selected':''}>${v}</option>`).join('')}</select></label>
      <label class="field"><span>สถานะ</span><select class="input" id="pf-st">${[['','ทุกสถานะ'],['active','เปิดใช้งาน'],['overdue','เลยกำหนด'],['off','ปิดใช้งาน']].map(([k,v])=>`<option value="${k}" ${k===f.st?'selected':''}>${v}</option>`).join('')}</select></label>
      ${f.term||f.team||f.rec||f.st||f.quick?'<button class="btn" id="pf-clear" style="align-self:end">ล้างตัวกรอง</button>':''}
    </div>
  </section>
  <section class="card">
    <div class="card-head"><h2>พบ ${rows.length} แผน</h2></div>
    ${rows.length?`<div class="tbl-wrap"><table class="compact pm-tbl"><thead><tr><th>รหัสแผน</th><th>ชื่อแผน</th><th>อุปกรณ์</th><th>พื้นที่</th><th>ทีม</th><th>รอบ</th><th>เวลาโดยประมาณ</th><th>ครบกำหนดถัดไป</th><th>ทำล่าสุด</th><th>สถานะ</th><th></th></tr></thead><tbody>
    ${rows.map(p=>{ const s=planState(p); return `<tr>
      <td class="mono">${esc(p.code||'–')}</td><td style="white-space:normal;min-width:180px">${esc(p.name)}</td>
      <td>${p.equipment?`<span class="mono">${esc(p.equipment.asset_code)}</span> – ${esc(p.equipment.name)}`:'–'}</td>
      <td>${esc(p.equipment?.location?.name||'–')}</td><td>${p.team?teamTag(p.team):'<span class="muted">–</span>'}</td>
      <td><span class="pill plain">${esc(recurText(p))}</span></td><td class="mono">${fmtN(p.estimated_hours,1)} ชม.</td>
      <td class="${s==='overdue'?'sla bad':s==='soon'?'sla warn':''}">${fmtD(p.next_due_date)}</td>
      <td class="${lastDone[p.id]?'':'muted'}">${lastDone[p.id]?fmtD(lastDone[p.id]):'ยังไม่เคยทำ'}</td>
      <td><span class="pill ${ST[s][1]}">${ST[s][0]}</span></td>
      <td><div class="acts"><button class="icon-btn" data-chk="${p.id}" title="รายการตรวจเช็กและประวัติ" aria-label="รายการตรวจเช็ก">${svgI('wo')}</button>
        ${can('pm.manage')?`<button class="icon-btn" data-edit="${p.id}" title="แก้ไขแผน" aria-label="แก้ไข">${svgI('edit')}</button>
        <button class="icon-btn" data-tog="${p.id}" title="${p.active?'ปิดใช้งานแผน':'เปิดใช้งานแผน'}" aria-label="เปิด/ปิดแผน">${svgI(p.active?'eye':'eyeoff')}</button>`:''}</div></td></tr>`; }).join('')}

  const again = () => PAGES.pm().catch(fail);

/* ============ EQUIPMENT IMPORT (Excel) ============ */
const IMPORT_COLS = [
  ['purchase_date', /install\s*date|วันที่ติดตั้ง|purchase\s*date|วันที่ซื้อ/i],
  ['asset_number', /asset\s*(no|number)|หมายเลขสินทรัพย์|เลขทะเบียนสินทรัพย์/i],
  ['asset_code', /m\/c|machine\s*(no|number|code)|หมายเลขเครื่อง|รหัสทรัพย์สิน|รหัสอุปกรณ์|asset.?code|equipment.?code/i],
  ['po_number', /purchase\s*order|ใบสั่งซื้อ|^\s*p\.?o\.?\b/i],
  ['serial_number', /serial|s\/n/i],
  ['name', /machine\s*name|equipment\s*name|ชื่อเครื่อง|ชื่ออุปกรณ์|^\s*name\s*$/i],
  ['model', /model|spec|รุ่น/i],
  ['manufacturer', /manufacturer|brand|ยี่ห้อ/i],
  ['supplier', /supplier|vend|ผู้ขาย|ผู้ผลิต/i],
  ['cost', /cost|ค่าใช้จ่าย|ราคา/i],
  ['category', /category|ประเภท|หมวด/i],
  ['remark', /remark|หมายเหตุ|note/i],
  ['location', /install|สถานที่|พื้นที่|location|area/i],
];
const CAT_KEYS = [[/pump/i,'Pump'],[/compressor/i,'Compressor'],[/desiccant|air\s*dryer/i,'Compressor'],[/chiller/i,'HVAC'],[/boiler|burner|deaerator/i,'Boiler'],[/fan|ventilat|ahu|blower/i,'Ventilation'],
  [/generator|substation|electrical|mdb|swg|transformer/i,'Electrical'],[/agitator|mixer/i,'Agitator'],[/tank|vessel|tower/i,'Tank / Vessel'],[/membrane/i,'membrane'],[/fire/i,'Fire Protection'],[/motor/i,'Motor'],[/crane|hoist/i,'Crane / Hoist'],[/lift|elevator/i,'Elevator / Lift']];
function importCell(v){ if (v==null) return ''; if (v instanceof Date) return v; return String(v).replace(/\s+/g,' ').trim(); }
function importDate(v){
  if (v instanceof Date && !isNaN(v)) return { date: `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`, extra:'' };
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v-25569)*864e5)); return importDate(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v||'').trim(); if (!s) return { date:null, extra:'' };
  const m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return { date:null, extra:s };
  let y = Number(m[3]); if (y < 100) y = y >= 40 ? 2500 + y : 2000 + y; if (y > 2400) y -= 543;
  const d = Number(m[1]), mo = Number(m[2]); if (mo<1||mo>12||d<1||d>31) return { date:null, extra:s };
  const rest = s.replace(m[0],'').trim();
  return { date:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`, extra: rest ? s : '' };
}
function importBrand(model){
  if (!model) return '';
  let m = model.match(/^([^\/]{2,30}?)\s*\/\s+/); if (m && !/\d{2,}/.test(m[1])) return m[1].trim();
  m = model.match(/^([A-Za-z][\w\-]*)\s+(oil|model|type)\b/i); if (m) return m[1];
  return '';
}
function parseEquipmentRows(aoa, opts={}){
  const typeNames = opts.typeNames || [];
  let hi = aoa.findIndex(r => r.some(c => /machine\s*name|equipment\s*name|ชื่อเครื่อง|ชื่ออุปกรณ์/i.test(String(c||''))));
  if (hi < 0) throw new Error('ไม่พบแถวหัวตาราง ต้องมีคอลัมน์ "ชื่อเครื่องจักร" หรือ "MACHINE NAME"');
  const heads = aoa[hi].map(c=>String(c||''));
  let start = hi + 1;
  const next = aoa[hi+1] || [];
  if (next.some(c => /machine\s*name|m\/c|install|model/i.test(String(c||'')))) { next.forEach((c,i)=>{ heads[i] = (heads[i]||'')+' '+String(c||''); }); start = hi + 2; }
  const map = {}; const used = new Set();
  heads.forEach((h,i)=>{ for (const [k,re] of IMPORT_COLS) { if (!used.has(k) && re.test(h)) { map[i]=k; used.add(k); break; } } });
  if (!used.has('name')) throw new Error('ไม่พบคอลัมน์ชื่อเครื่องจักร');
  const out = [];
  for (let r = start; r < aoa.length; r++) {
    const row = aoa[r]; if (!row || row.every(c => importCell(c)==='')) continue;
    const o = { _row: r+1 }; const notes = [];
    Object.entries(map).forEach(([i,k]) => { o[k] = importCell(row[i]); });
    const remark = o.remark || ''; delete o.remark;
    if (/critical/i.test(remark)) o.criticality='critical'; else if (/core/i.test(remark)) o.criticality='core'; else if (/general/i.test(remark)) o.criticality='general'; else if (remark) notes.push(remark);
    if (o.purchase_date !== undefined) { const d = importDate(o.purchase_date); o.purchase_date = d.date; if (d.extra) notes.push('วันที่ติดตั้ง (จากไฟล์): '+d.extra); }
    if (!o.manufacturer) o.manufacturer = importBrand(o.model);
    if (!o.category) { const hit = CAT_KEYS.find(([re]) => re.test(o.name||'')); if (hit && (!typeNames.length || typeNames.includes(hit[1]))) o.category = hit[1]; }
    if (opts.source) notes.push(`[ที่มา: ${opts.source}]`);
    o.notes = notes.join(' | ');
    for (const k in o) if (o[k] instanceof Date) o[k] = String(o[k]);
    out.push(o);
  }
  if (opts.autoCode) assignAutoCodes(out, opts.existingCodes);
  return { rows: out, columns: Object.values(map) };
}
function assignAutoCodes(out, existingCodes){
    const codes = new Set(out.map(o=>o.asset_code).filter(Boolean).concat(existingCodes||[]));
    out.filter(o=>!o.asset_code).forEach(o=>{
      const sib = out.filter(x=>x.asset_code && x.location===o.location).map(x=>x.asset_code.split('-')[0]);
      const pre = sib.sort((a,b)=>sib.filter(x=>x===b).length - sib.filter(x=>x===a).length)[0] || 'EQ';
      const abbr = (o.name||'X').split(/[\s\-.]+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3) || 'X';
      let n = 1, c; do { c = `${pre}-${abbr}-${String(n).padStart(2,'0')}`; n++; } while (codes.has(c));
      codes.add(c); o.asset_code = c; o._generated = true;
    });
}

  ${pager(f.page,size,count)}`;
  const again = () => PAGES.parts().catch(fail);
  let tm; $('#ptQ').oninput = e => { clearTimeout(tm); tm = setTimeout(()=>{ f.term=e.target.value.trim(); f.page=0; PAGES.parts().then(()=>{ const i=$('#ptQ'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }).catch(fail); }, 300); };

/* Excel import: "Inventory Balance" layout (Part No, Part Name, Model, Specifications, Type, Item code, Balance, Unit, Safety/Min/Max/Reorder point, Supplier, Location, Unit price) */
const PART_COLS = [
  ['part_code', /^part\s*no|^part\s*code|รหัสอะไหล่/i], ['name', /^part\s*name|ชื่ออะไหล่/i], ['model', /^model|ยี่ห้อ|รุ่น/i], ['spec', /^spec|สเปก|รายละเอียด/i],
  ['category', /^type$|^category|หมวด/i], ['item_code', /^item\s*code/i], ['balance', /^balance|คงเหลือ|ยอดคงเหลือ/i], ['unit', /^unit$|หน่วย/i],
  ['safety_stock', /^safety/i], ['min_qty', /^min$/i], ['max_qty', /^max$/i], ['reorder_point', /reorder|จุดสั่งซื้อ/i],
  ['supplier', /supplier|ผู้จำหน่าย|ผู้ขาย/i], ['storage_location', /^location|ที่เก็บ/i], ['unit_cost', /unit\s*price|^cost$|ราคา/i], ['remark', /^remark|หมายเหตุ/i]
];
function partImport(){
  openPanel('นำเข้า / อัปเดตยอดอะไหล่จาก Excel', 'ใช้ไฟล์ Inventory Balance ได้โดยตรง · รหัสที่มีอยู่แล้วจะอัปเดตข้อมูลและยอดคงเหลือ · รหัสใหม่จะเพิ่มเข้าไป', `
  <section class="card">
    <label class="field"><span>เลือกไฟล์ (.xlsx, .xls, .csv)</span><input class="input" type="file" id="piFile" accept=".xlsx,.xls,.csv"></label>
    <label class="field" id="piSheetW" hidden><span>ชีต</span><select class="input" id="piSheet"></select></label>
    <div id="piOut"></div>
  </section>`);
  let wb = null, rows = [];
  const analyse = async () => {
    const out = $('#piOut');
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[$('#piSheet').value], { header:1, raw:true, defval:'' });
    const hi = aoa.findIndex(r => r.some(c => /^part\s*no|^part\s*code|รหัสอะไหล่/i.test(String(c).trim())));
    if (hi < 0) { out.innerHTML = '<div class="note">ไม่พบหัวคอลัมน์ "Part No" ในชีตนี้</div>'; return; }
    const h1 = aoa[hi].map(c=>String(c).trim()), h2 = (aoa[hi+1]||[]).map(c=>String(c).trim());
    const map = {};
    PART_COLS.forEach(([k,re]) => { let i = h1.findIndex(h => re.test(h)); if (i < 0 || k==='unit_cost' && h2.some(h=>/unit\s*price/i.test(h))) { const j = h2.findIndex(h => re.test(h)); if (j >= 0) i = j; } if (i >= 0) map[k] = i; });
    if (map.part_code == null || map.balance == null) { out.innerHTML = '<div class="note">ต้องมีคอลัมน์ Part No และ Balance</div>'; return; }
    const start = h2.some(h => /safety|min|max|reorder|unit price/i.test(h)) ? hi + 2 : hi + 1;
    const val = (r,k) => map[k]==null ? '' : r[map[k]];
    rows = aoa.slice(start).filter(r => String(val(r,'part_code')).trim()).map(r => { const o = {}; Object.keys(map).forEach(k => { let v = val(r,k); if (v instanceof Date) v = v.toISOString().slice(0,10); o[k] = typeof v === 'number' ? v : String(v).trim(); }); return o; });
    const codes = rows.map(r=>String(r.part_code));
    const dup = codes.filter((c,i)=>codes.indexOf(c)!==i);
    const existing = new Map();
    for (let i=0;i<codes.length;i+=300) { const { data } = await sb.from('spare_parts').select('part_code,quantity_on_hand').in('part_code', codes.slice(i,i+300)); (data||[]).forEach(p=>existing.set(p.part_code, Number(p.quantity_on_hand))); }
    const isNew = rows.filter(r=>!existing.has(String(r.part_code))).length;
    const changed = rows.filter(r=>existing.has(String(r.part_code)) && Number(r.balance) !== existing.get(String(r.part_code)));
    const neg = rows.filter(r=>Number(r.balance) < 0);
    const labels = { part_code:'Part No', name:'ชื่อ', model:'รุ่น', spec:'สเปก', category:'หมวด', item_code:'Item code', balance:'คงเหลือ', unit:'หน่วย', safety_stock:'Safety', min_qty:'Min', max_qty:'Max', reorder_point:'Reorder point', supplier:'ผู้จำหน่าย', storage_location:'ที่เก็บ', unit_cost:'ราคา/หน่วย', remark:'หมายเหตุ' };
    out.innerHTML = `
      <div class="kpis k4" style="margin:4px 0 0">${kpi('parts','ในไฟล์', fmtN(rows.length,0), 'รายการ', '', 'accent')}${kpi('plus','เพิ่มใหม่', fmtN(isNew,0), 'รายการ', '', 'ok')}${kpi('edit','ยอดเปลี่ยน', fmtN(changed.length,0), 'รายการ', 'บันทึกเป็นการปรับยอด', changed.length?'warn':'ok')}${kpi('pulse','ยอดติดลบ', fmtN(neg.length,0), 'รายการ', neg.length?'นำเข้าตามไฟล์':'', neg.length?'bad':'ok')}</div>
      <p class="small muted">คอลัมน์ที่อ่านได้: ${Object.keys(map).map(k=>labels[k]).join(', ')}${dup.length?` · <span class="sla bad">รหัสซ้ำในไฟล์ ${dup.length} รายการ (ใช้แถวล่าสุด)</span>`:''}</p>
      <div class="tbl-wrap" style="max-height:260px"><table class="compact"><thead><tr><th>Part No</th><th>ชื่อ</th><th class="num">คงเหลือ</th><th>หน่วย</th><th class="num">RP</th><th class="num">ราคา</th></tr></thead><tbody>${rows.slice(0,15).map(r=>`<tr><td class="mono">${esc(r.part_code)}</td><td>${esc(r.name)}</td><td class="num mono">${esc(r.balance)}</td><td>${esc(r.unit)}</td><td class="num mono">${esc(r.reorder_point)}</td><td class="num mono">${esc(r.unit_cost)}</td></tr>`).join('')}</tbody></table></div>
      <label class="field"><span>อ้างอิง (บันทึกในประวัติการเคลื่อนไหว)</span><input class="input" id="piRef" value="${esc(($('#piFile').files[0]?.name||'Excel').replace(/\.[^.]+$/,''))}"></label>
      <div class="row"><button class="btn primary" id="piGo">นำเข้า ${fmtN(rows.length,0)} รายการ</button><span class="small muted" id="piMsg"></span></div>`;
    $('#piGo').onclick = async () => {
      const btn = $('#piGo'); btn.disabled = true; const tot = { inserted:0, updated:0, adjusted:0 }; const ref = $('#piRef').value.trim();
      const uniq = [...new Map(rows.map(r=>[String(r.part_code), r])).values()];
      try {
        for (let i=0;i<uniq.length;i+=200) { $('#piMsg').textContent = `กำลังนำเข้า ${fmtN(Math.min(i+200,uniq.length),0)} / ${fmtN(uniq.length,0)}…`;
          const { data } = await q(sb.rpc('import_parts', { p_rows: uniq.slice(i,i+200), p_source: ref })); Object.keys(tot).forEach(k=>tot[k]+=data[k]||0); }
        closePanel(); toast(`นำเข้าแล้ว: เพิ่มใหม่ ${tot.inserted} · อัปเดต ${tot.updated} · ปรับยอด ${tot.adjusted} รายการ`); partFilter.page=0; PAGES.parts().catch(fail); refreshAlerts();
      } catch(e){ fail(e); btn.disabled = false; $('#piMsg').textContent = `หยุดที่รายการที่ ${tot.inserted+tot.updated+1}`; }
    };
  };
  $('#piFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; $('#piOut').innerHTML = '<div class="loading">กำลังอ่านไฟล์…</div>';
    try { await loadXLSX(); wb = XLSX.read(await f.arrayBuffer(), { cellDates:true });
      $('#piSheet').innerHTML = wb.SheetNames.map(n=>`<option>${esc(n)}</option>`).join(''); $('#piSheetW').hidden = wb.SheetNames.length < 2; await analyse(); } catch(err){ fail(err); $('#piOut').innerHTML=''; } };
  $('#piSheet').onchange = () => wb && analyse().catch(fail);
}

/* searchable part picker used in work orders */
function bindPartCombo(inp, list, onPick){
  let timer;
  inp.addEventListener('input', () => { onPick(null); clearTimeout(timer); const term = inp.value.trim(); if (!term) { list.hidden = true; return; }

// ---- นำเข้ารายชื่อพนักงานจาก Excel / วางจากตาราง → สร้างบัญชี + กำหนดบทบาทตามตำแหน่ง ----
function roleFromPosition(pos){
  const t = String(pos||'').toLowerCase();
  if (/(senior engineer|sr\.? ?engineer|avp|vice president|manager|ผู้จัดการ|เมเนเจอร์|วิศวกรอาวุโส)/.test(t)) return 'manager';
  if (/engineer|วิศวกร/.test(t)) return 'engineer';
  if (/(store|สโตร์|คลัง|admin|clerk|ธุรการ|officer)/.test(t)) return 'reporter';
  if (/(leader|shift lead|supervisor|หัวหน้า)/.test(t)) return 'supervisor';
  if (/(technician|ช่าง)/.test(t)) return 'technician';
  return 'technician';
}
function genPassword(){ const a='abcdefghjkmnpqrstuvwxyz', d='23456789'; const r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  let s=''; for(let i=0;i<5;i++) s+=a[r(a.length)]; s=s[0].toUpperCase()+s.slice(1); for(let i=0;i<4;i++) s+=d[r(d.length)]; return s+'!'; }
function userImport(people, after){
  const norm = x => String(x??'').replace(/\s+/g,' ').trim();
  const stripTitle = x => norm(x).replace(/^(นางสาว|นาง|นาย|น\.ส\.)\s*/,'');
  const H = { eng:/name\s*\(eng|english/i, id:/employee\s*id|รหัสพนักงาน/i, th:/name\s*\(thai|ชื่อ.*ไทย|ชื่อ-นามสกุล/i, nick:/^nick\s*name$|ชื่อเล่น$/i, nickth:/nick\s*name\s*\(thai/i, pos:/position|ตำแหน่ง/i, phone:/phone|โทร/i, email:/e-?mail|อีเมล/i };
  let rows = [];
  openPanel('นำเข้ารายชื่อพนักงาน','สร้างบัญชีให้หลายคนพร้อมกัน · บทบาทกำหนดจากตำแหน่งอัตโนมัติ (แก้ได้ก่อนยืนยัน)', `
    <section class="card">
      <label class="field"><span>เลือกไฟล์ Excel รายชื่อพนักงาน</span><input type="file" class="input" id="ui-file" accept=".xlsx,.xls,.csv"></label>
      <label class="field"><span>หรือคัดลอกแถวจาก Excel (รวมแถวหัวตาราง) แล้ววางที่นี่</span><textarea class="input" id="ui-paste" rows="4" placeholder="Name (Eng)&#9;Employee ID&#9;Name (Thai)&#9;Nick Name&#9;Nick Name (Thai)&#9;Position&#9;Phone Number&#9;Email"></textarea></label>
      <div class="note small">ตำแหน่ง → บทบาท: Senior Engineer → ${ROLE.manager} · Engineer → ${ROLE.engineer} · Leader Technician / Leader Shift → ${ROLE.supervisor} · Technician → ${ROLE.technician} · Store control office / Admin → ${ROLE.reporter}<br>ชื่อผู้ใช้ = รหัสพนักงาน · รหัสผ่านเริ่มต้นสุ่มให้แต่ละคน และดาวน์โหลดเป็นไฟล์ได้หลังสร้างเสร็จ</div>
    </section>
    <section class="card" id="ui-prev" hidden></section>`);
  const fromGrid = grid => {
    const hi = grid.findIndex(r => r.some(c=>H.eng.test(norm(c))) || r.some(c=>H.id.test(norm(c))));
    let col = {}, body = grid;
    if (hi>=0){ grid[hi].forEach((c,i)=>{ const t=norm(c); for (const [k,re] of Object.entries(H)) if (col[k]==null && re.test(t) && !(k==='nick' && H.nickth.test(t))) { col[k]=i; break; } }); body=grid.slice(hi+1); }
    else col = { eng:0,id:1,th:2,nick:3,nickth:4,pos:5,phone:6,email:7 };
    const byName = new Map(); people.forEach(p=>{ byName.set(stripTitle(p.full_name).split(' (')[0], p); if (p.username) byName.set(p.username.toLowerCase(), p); });
    rows = body.map(r=>{ const g=k=>col[k]==null?'':norm(r[col[k]]);
      const th=g('th'), eng=g('eng'), id=g('id').replace(/\D/g,''), nick=g('nickth')||g('nick'), email=g('email').replace(/\s/g,'');
      if (!th && !eng) return null;
      const full = (th||eng) + (nick?` (${nick})`:'');
      const ex = byName.get(stripTitle(th)) || byName.get(eng) || (id && byName.get(id)) || (email && people.find(p=>p.email && p.email.toLowerCase()===email.toLowerCase()));
      return { full, eng, id, pos:g('pos'), phone:g('phone'), email, role: ex?.role==='admin' ? 'admin' : roleFromPosition(g('pos')), username:(id||eng.toLowerCase().replace(/[^a-z0-9]+/g,'_')).slice(0,32), ex };
    }).filter(Boolean);
    paint();
  };
  const paint = () => {
    const box=$('#ui-prev'); box.hidden=false;
    const nNew=rows.filter(r=>!r.ex).length, nUpd=rows.length-nNew;
    box.innerHTML = `<div class="card-head"><h2>พบ ${rows.length} คน</h2><span class="small muted">สร้างใหม่ ${nNew} · มีบัญชีอยู่แล้ว (อัปเดตบทบาท/ตำแหน่ง) ${nUpd}</span></div>
      <div class="tbl-wrap"><table class="compact"><thead><tr><th>ชื่อ / ตำแหน่ง</th><th>ชื่อผู้ใช้</th><th>บทบาทในระบบ</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr><td>${esc(r.full)} ${r.ex?'<span class="pill plain">มีบัญชีแล้ว</span>':'<span class="pill st-new plain">ใหม่</span>'}<div class="small muted">${esc(r.pos||'–')}</div></td>
        <td class="mono">${r.ex?esc(r.ex.username||'–'):`<input class="input mono" style="width:112px" data-uu="${i}" value="${esc(r.username)}">`}</td>
        <td><select class="input" data-ur="${i}" ${r.ex?.role==='admin'?'disabled':''}>${ROLE_ORDER.filter(k=>k!=='admin'||r.role==='admin').map(k=>`<option value="${k}" ${k===r.role?'selected':''}>${ROLE[k]}</option>`).join('')}</select></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row"><button class="btn primary" id="ui-go">${svgI('check')} ยืนยัน สร้าง/อัปเดต ${rows.length} บัญชี</button></div><div id="ui-res"></div>`;
    $$('[data-ur]').forEach(s=>s.onchange=()=>{ rows[+s.dataset.ur].role=s.value; });
    $$('[data-uu]').forEach(s=>s.oninput=()=>{ rows[+s.dataset.uu].username=s.value.trim().toLowerCase(); });
    $('#ui-go').onclick = run;
  };
  const run = async () => {
    const bad = rows.find(r=>!r.ex && !/^[a-z0-9_]{3,32}$/.test(r.username));
    if (bad) return toast(`ชื่อผู้ใช้ของ ${bad.full} ไม่ถูกต้อง (a-z, 0-9, _ ยาว 3–32)`, true);
    $('#ui-go').disabled=true; const out=[]; let ok=0;

/* ============ CALENDAR ============ */
let calMonth = null;
function addRecur(d, type, n){
  const x = new Date(d);
  if (type==='daily'||type==='custom_days') x.setDate(x.getDate()+n);
  else if (type==='weekly') x.setDate(x.getDate()+7*n);
  else if (type==='monthly') x.setMonth(x.getMonth()+n);
  else if (type==='quarterly') x.setMonth(x.getMonth()+3*n);
  else if (type==='yearly') x.setFullYear(x.getFullYear()+n);
  else x.setMonth(x.getMonth()+1);
  return x;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
PAGES.calendar = async () => {
  if (!calMonth) { const t=new Date(today()+'T00:00:00'); calMonth = new Date(t.getFullYear(), t.getMonth(), 1); }
  const m0 = new Date(calMonth), m1 = new Date(m0.getFullYear(), m0.getMonth()+1, 1);
  const [{data:pms},{data:wos}] = await Promise.all([
    q(sb.from('pm_schedules').select('id,name,next_due_date,recurrence_type,recurrence_interval,equipment:equipment_id(asset_code)').eq('active',true)),
    q(sb.from('work_orders').select('id,code,title,status,priority,due_date,source').neq('status','cancelled').gte('due_date', new Date(m0.getTime()-7*3600e3).toISOString()).lt('due_date', new Date(m1.getTime()-7*3600e3).toISOString()).limit(2000))
  ]);
  const ev = {}; const push = (k,e) => (ev[k] = ev[k]||[]).push(e);
  (wos||[]).forEach(w=>push(new Date(w.due_date).toLocaleDateString('en-CA',{timeZone:TZ}), {t:'wo', w}));
  (pms||[]).forEach(p=>{ let d = new Date(p.next_due_date+'T00:00:00'); let guard=0;
    while (d < m1 && guard++ < 400) { if (d >= m0) push(ymd(d), {t:'pm', p, first: ymd(d)===p.next_due_date}); d = addRecur(d, p.recurrence_type, Math.max(1,p.recurrence_interval||1)); } });
  const start = new Date(m0); start.setDate(1 - m0.getDay());
  const cells = []; for (let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); if (i>=34 && d.getMonth()!==m0.getMonth() && cells.length%7===0) break; }
  const tStr = today();
  const monthName = new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'}).format(m0);
  const nWo = (wos||[]).length, nPm = Object.values(ev).flat().filter(e=>e.t==='pm').length;
  $('#view').innerHTML = `
  <div class="page-head"><div><h1>${monthName}</h1><p>ใบงานที่ครบกำหนด ${nWo} งาน · รอบ PM ตามแผน ${nPm} รอบ</p></div>
    <div class="row"><button class="btn" id="calPrev" aria-label="เดือนก่อน">‹</button><button class="btn" id="calToday">เดือนนี้</button><button class="btn" id="calNext" aria-label="เดือนถัดไป">›</button></div></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>รอบ PM ตามแผน</span><span><i style="background:var(--bad)"></i>ด่วนมาก/สูง</span><span><i style="background:var(--accent)"></i>ใบงานอื่น</span><span><i style="background:var(--ink-3)"></i>เสร็จแล้ว</span></div>
  <div class="cal-wrap"><div class="cal">
    ${['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'].map(d=>`<div class="cal-h">${d}</div>`).join('')}
    ${cells.map(d=>{ const k=ymd(d); const list=ev[k]||[]; const out = d.getMonth()!==m0.getMonth();
      return `<div class="cal-c ${out?'out':''} ${k===tStr?'today':''}"><span class="cal-d">${d.getDate()}</span>
        ${list.slice(0,3).map(e=> e.t==='wo'
          ? `<button class="chip ${['done','closed'].includes(e.w.status)?'c-done':['urgent','high'].includes(e.w.priority)?'c-hot':'c-wo'}" data-wo="${e.w.id}" title="${esc(e.w.code+' '+e.w.title)}">${esc(e.w.code.replace(/^WO-\d{4}-0*/,'#'))} ${esc(e.w.title)}</button>`
          : `<button class="chip c-pm" data-pmgo="1" title="${esc(e.p.name)}">PM ${esc(e.p.equipment?.asset_code||'')} ${esc(e.p.name)}</button>`).join('')}
        ${list.length>3?`<span class="small muted">+${list.length-3} รายการ</span>`:''}</div>`; }).join('')}
  </div></div>
  <p class="small muted" style="margin:0">รอบ PM ที่แสดงคำนวณล่วงหน้าจากความถี่ของแผน ใบงาน PM จริงจะถูกสร้างเมื่อถึงกำหนด</p>`;
  const go = n => { calMonth = new Date(m0.getFullYear(), m0.getMonth()+n, 1); PAGES.calendar().catch(fail); };
  $('#calPrev').onclick=()=>go(-1); $('#calNext').onclick=()=>go(1); $('#calToday').onclick=()=>{ calMonth=null; PAGES.calendar().catch(fail); };
  $$('[data-wo]').forEach(b=>b.onclick=()=>openWO(b.dataset.wo));
  $$('[data-pmgo]').forEach(b=>b.onclick=()=>{ location.hash='#pm'; });
};

function downloadCsv(name, rows){

const _scripts = {};
function loadScript(src){ return _scripts[src] || (_scripts[src] = new Promise((res, rej) => { const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ delete _scripts[src]; rej(new Error('โหลดไลบรารีไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต')); }; document.head.appendChild(s); })); }
const QR_LIB = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
function appBaseUrl(){

const PHOTO_BUCKET = 'work-order-photos';
function compressImage(file, max=1600, quality=0.8){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max/Math.max(img.width, img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=> b ? res(b) : rej(new Error('แปลงรูปไม่สำเร็จ')), 'image/jpeg', quality); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ไฟล์นี้ไม่ใช่รูปภาพ')); };
    img.src = url;
  });
}
/* media (photo + video) */
const VIDEO_MAX_MB = 50;
const isVideo = f => /^video\//.test(f?.type || f?.content_type || '') || /\.(mp4|mov|webm|3gp)$/i.test(f?.storage_path || f?.name || '');
const VIDEO_TYPES = { 'video/mp4':'mp4', 'video/quicktime':'mov', 'video/webm':'webm', 'video/3gpp':'3gp' };
function checkMedia(f){
  if (/^image\//.test(f.type)) return null;
  if (!isVideo(f)) return `${f.name}: แนบได้เฉพาะรูปภาพหรือวิดีโอ`;
  if (!VIDEO_TYPES[f.type || 'video/mp4'] && f.type) return `${f.name}: รองรับวิดีโอ MP4 / MOV / WEBM`;
  if (f.size > VIDEO_MAX_MB*1024*1024) return `${f.name}: วิดีโอใหญ่ ${fmtN(f.size/1048576,0)} MB เกิน ${VIDEO_MAX_MB} MB (ถ่ายสั้นลง ไม่เกิน ~30 วินาที)`;
  return null;
}
async function uploadMedia(woId, kind, files, name){
  let n = 0;
  for (const f of files) {
    const err = checkMedia(f); if (err) throw new Error(err);
    const vid = isVideo(f);
    const blob = vid ? f : await compressImage(f);
    const type = vid ? (VIDEO_TYPES[f.type] ? f.type : 'video/mp4') : 'image/jpeg';
    const ext = vid ? VIDEO_TYPES[type] : 'jpg';
    const path = `${woId}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
    const up = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType:type, upsert:false });
    if (up.error) throw up.error;
    const row = { work_order_id:woId, storage_path:path, file_name:f.name||(vid?'video.'+ext:'photo.jpg'), content_type:type, size_bytes:blob.size, uploader_name:name, kind };
    if (S.profile) row.uploaded_by = uid();
    const { error } = await sb.from('work_order_attachments').insert(row); if (error) throw error;
    n++;
  }
  return n;
}
const mediaWord = files => { const v = files.filter(isVideo).length, p = files.length - v; return [p?`รูป ${p}`:'', v?`วิดีโอ ${v}`:''].filter(Boolean).join(' · '); };
async function uploadWoPhotos(woId, kind, files){
  const n = await uploadMedia(woId, kind, files, S.profile.full_name);
  if (n) await sb.from('work_order_events').insert({ work_order_id:woId, actor_id:uid(), event_type:'comment', comment:`แนบ${kind==='before'?'ก่อนซ่อม':kind==='after'?'หลังซ่อม':''} ${mediaWord(files)}` });
  return n;
}

/* ============ PM CHECKLIST EXECUTION ============ */
function chkItem(c){ if (typeof c==='string') return { item:c }; return { item:c?.item||'', unit:c?.unit||'', min:c?.min??null, max:c?.max??null }; }
const chkMeasure = x => !!(x.unit || x.min!=null || x.max!=null);
function chkToLine(c){ const x=chkItem(c); if (!chkMeasure(x)) return x.item; const rng = (x.min!=null||x.max!=null) ? `${x.min??''}-${x.max??''}` : ''; return [x.item, x.unit||'', rng].join(' | ').replace(/( \| )+$/,''); }
function parseChkLine(s){
  const p = s.split('|').map(x=>x.trim()); if (p.length < 2) return s.trim();
  const o = { item:p[0] }; if (p[1]) o.unit = p[1];
  if (p[2]) { const m = p[2].match(/^(-?\d*\.?\d*)\s*-\s*(-?\d*\.?\d*)$/); if (m) { if (m[1]!=='') o.min=Number(m[1]); if (m[2]!=='') o.max=Number(m[2]); } }
  return o;
}
const rangeText = x => (x.min!=null||x.max!=null) ? `เกณฑ์ ${x.min??'…'}–${x.max??'…'} ${x.unit||''}` : (x.unit?`หน่วย ${x.unit}`:'');
function pmChecklistHTML(w, checklist, results, editable){
  const R = {}; (results||[]).forEach(r=>R[r.idx]=r);
  const done = Object.values(R).filter(r=>r.result).length, fails = Object.values(R).filter(r=>r.result==='fail').length;
  const RL = { pass:['ผ่าน','ok'], fail:['ไม่ผ่าน','bad'], na:['N/A','na'] };
  return `<div class="card-head"><h3>รายการตรวจเช็ก PM</h3><span class="small ${fails?'sla bad':'muted'}">${done}/${checklist.length} ข้อ${fails?` · ไม่ผ่าน ${fails}`:''}</span></div>
  <div class="chk-list">${checklist.map((c,i)=>{ const x=chkItem(c), r=R[i]||{};
    return `<div class="chk-row" data-i="${i}">
      <div class="chk-t"><b>${i+1}. ${esc(x.item)}</b>${chkMeasure(x)?`<span class="small muted">${esc(rangeText(x))}</span>`:''}</div>
      ${editable ? `<div class="chk-in">
        ${chkMeasure(x)?`<span class="chk-val"><input class="input mono" type="number" step="any" inputmode="decimal" data-v value="${r.value??''}" placeholder="ค่าที่วัด">${x.unit?`<span class="small">${esc(x.unit)}</span>`:''}</span>`:''}
        <div class="seg" role="group">${Object.entries(RL).map(([k,[l,c]])=>`<button type="button" class="seg-b ${c} ${r.result===k?'on':''}" data-r="${k}">${l}</button>`).join('')}</div>
        <input class="input chk-note" data-n value="${esc(r.note||'')}" placeholder="หมายเหตุ (ถ้ามี)"></div>`
      : `<div class="chk-in">${r.value!=null?`<span class="mono">${fmtN(r.value,2)} ${esc(r.unit||x.unit||'')}</span>`:''}${r.result?`<span class="pill ${r.result==='pass'?'st-done':r.result==='fail'?'st-cancelled-bad':'st-closed'}">${RL[r.result][0]}</span>`:'<span class="small muted">ยังไม่บันทึก</span>'}${r.note?`<span class="small muted">${esc(r.note)}</span>`:''}</div>`}
    </div>`; }).join('')}</div>
  ${editable?`<div class="row"><button type="button" class="btn" data-pm="save">บันทึกผล</button><button type="button" class="btn ok" data-pm="complete">บันทึกและปิดงาน PM</button><span class="small muted">ข้อที่ไม่ผ่าน ระบบจะเปิดใบงานซ่อมต่อให้อัตโนมัติ</span></div>`:''}`;
}
function bindPmChecklist(w, checklist, box, after){
  $$('.chk-row', box).forEach(row => {
    const i = Number(row.dataset.i), x = chkItem(checklist[i]);
    $$('.seg-b', row).forEach(b => b.onclick = () => { $$('.seg-b', row).forEach(o=>o.classList.toggle('on', o===b)); });
    const v = $('[data-v]', row);
    if (v) v.oninput = () => { if (v.value==='') return; const n=Number(v.value); const out=(x.min!=null&&n<x.min)||(x.max!=null&&n>x.max);
      $$('.seg-b', row).forEach(o=>o.classList.toggle('on', o.dataset.r === (out?'fail':'pass'))); };
  });
  const collect = () => $$('.chk-row', box).map(row => { const i=Number(row.dataset.i), x=chkItem(checklist[i]);
    return { idx:i, item:x.item, result:$('.seg-b.on', row)?.dataset.r||'', value:$('[data-v]', row)?.value||'', unit:x.unit||'', note:$('[data-n]', row)?.value.trim()||'' }; });
  $$('[data-pm]', box).forEach(b => b.onclick = async () => {
    const res = collect(), complete = b.dataset.pm==='complete';
    if (complete && res.some(r=>!r.result)) return toast(`ยังไม่ได้บันทึกผล ${res.filter(r=>!r.result).length} ข้อ`, true);
    b.disabled = true;
    try { const { data } = await q(sb.rpc('submit_pm_results', { p_wo:w.id, p_results:res, p_complete:complete }));
      toast(complete ? (data.fails ? `ปิดงาน PM แล้ว · เปิดใบงานซ่อมต่อ ${data.follow_up_code||''}` : 'ปิดงาน PM แล้ว ผ่านทุกข้อ') : 'บันทึกผลตรวจแล้ว');
      after && after(data);
    } catch(e){ fail(e); b.disabled=false; }
  });
}
