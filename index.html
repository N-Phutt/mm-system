      <h3 class="job-title">${esc(w.title)}</h3>
      <div class="job-meta">${w.equipment?`<span class="mono">${esc(w.equipment.asset_code)}</span> ${esc(w.equipment.name)}`:'ไม่ระบุอุปกรณ์'}${w.location?` · ${esc(w.location.name)}`:''}${w.equipment_down?' · <b class="down">เครื่องหยุด</b>':''}</div>
      ${w.verify_result==='rejected' && OPEN.includes(w.status) ? `<div class="rework-note">↩ <b>Engineer ส่งกลับแก้ไข${w.rework_count>1?` (ครั้งที่ ${w.rework_count})`:''}:</b> ${esc(w.verify_note||'')}</div>` : ''}
      <div class="job-status">${statusPill(w.status)} <span class="small muted">แจ้ง ${timeAgo(w.created_at)}ที่แล้ว</span></div>
      <div class="job-acts"><button class="btn ${next[2]} big" data-do="${next[0]}">${next[1]}</button>
        ${!isPool?`<label class="btn big icon-only" title="ถ่ายรูป / วิดีโอ">${svgI('camera')}<input type="file" accept="image/*,video/*" multiple hidden data-snap></label>`:''}
        ${!isPool && w.status==='in_progress'?`<button class="btn big" data-do="hold" title="พักงาน">พัก</button>`:''}
        <button class="btn big" data-do="open">รายละเอียด</button></div>
    </article>`; };
  $('#view').innerHTML = `
  <div class="page-head"><div><h1>งานของฉัน</h1><p>${mine.length} งานค้าง · เสร็จใน 24 ชม. ${done.length} งาน</p></div><a class="btn primary" href="#new">+ แจ้งซ่อม</a></div>
  ${mine.length?`<div class="jobs">${mine.map(w=>card(w,false)).join('')}</div>`:'<section class="card"><div class="empty">ไม่มีงานค้าง 👍</div></section>'}
  ${can('wo.edit')?`<h2 class="sec-h">งานใหม่ที่รอรับ <span class="small muted">(${pool.length})</span></h2>${pool.length?`<div class="jobs">${pool.map(w=>card(w,true)).join('')}</div>`:'<section class="card"><div class="empty">ไม่มีงานรอรับ</div></section>'}`:''}`;
  const all = [...mine, ...pool];
  $$('[data-job]').forEach(el => { const w = all.find(x=>x.id===el.dataset.job);
    $$('[data-do]', el).forEach(b => b.onclick = async () => { const d=b.dataset.do; b.disabled=true;
      try {
        if (d==='open') { b.disabled=false; return openWO(w.id); }
        if (d==='claim') { await q(sb.rpc('claim_work_order',{p_id:w.id})); toast(`รับงาน ${w.code} แล้ว`); }
        if (d==='start') { await q(sb.from('work_orders').update({status:'in_progress'}).eq('id',w.id)); toast(`เริ่มซ่อม ${w.code}`); }
        if (d==='hold') { await q(sb.from('work_orders').update({status:'on_hold'}).eq('id',w.id)); toast(`พักงาน ${w.code}`); }
        if (d==='finish') { b.disabled=false; return w.source==='pm' && w.pm_schedule_id ? openWO(w.id) : quickFinish(w, ()=>PAGES.my().catch(fail)); }
        refreshOpenCount(); PAGES.my().catch(fail);
      } catch(e){ fail(e); b.disabled=false; } });
    const snap = $('[data-snap]', el);
    if (snap) snap.onchange = async () => { if (!snap.files.length) return; try { const fs=[...snap.files]; await uploadWoPhotos(w.id, w.status==='in_progress'?'after':'before', fs); toast(`อัปโหลด${mediaWord(fs)}แล้ว`); } catch(e){ fail(e); } };
  });
};

/* ============ QR PRINT ============ */
async function printQR(list){
  if (!list.length) return toast('ไม่มีอุปกรณ์ให้พิมพ์', true);
  document.getElementById('printArea')?.remove();
  const wrap = document.createElement('div'); wrap.id='printArea'; wrap.className='print-area';
  wrap.innerHTML = `<div class="print-bar no-print"><b>พิมพ์สติกเกอร์ QR · ${list.length} เครื่อง</b>
      <label class="small">ขนาด <select class="input" id="prSize" style="width:auto"><option value="m">กลาง 63.5×38 มม. (21 ดวง/A4)</option><option value="l">ใหญ่ 99×67 มม. (8 ดวง/A4)</option><option value="s">เล็ก 48×25 มม. (40 ดวง/A4)</option></select></label>
      <button class="btn primary" id="prGo">${svgI('reports')} พิมพ์</button><button class="btn" id="prClose">ปิด</button>
      <span class="small muted">QR เปิดลิงก์ ${esc(appBaseUrl())}#asset/…</span></div>
    <div class="labels m" id="prLabels"><div class="loading">กำลังสร้าง QR…</div></div>`;
  document.body.appendChild(wrap); document.body.classList.add('printing');
  $('#prClose').onclick = () => { wrap.remove(); document.body.classList.remove('printing'); };
  $('#prSize').onchange = e => { $('#prLabels').className = 'labels ' + e.target.value; };
  $('#prGo').onclick = () => window.print();
  try {
    const svgs = await Promise.all(list.map(e=>qrSvg(assetUrl(e.asset_code))));
    const org = esc(S.cfg.general.short_name||'MS');
    $('#prLabels').innerHTML = list.map((e,i)=>`<div class="lbl ${e.criticality==='critical'?'lbl-crit':''}"><div class="lbl-qr">${svgs[i]}</div><div class="lbl-t"><b class="mono">${esc(e.asset_code)}</b><span>${esc(e.name)}</span><small>${esc(e.location?.name||e.location||'')}</small><small class="lbl-foot">${e.criticality==='critical'?'⚠ CRITICAL · ':''}${org} · สแกนเพื่อแจ้งซ่อม</small></div></div>`).join('');
  } catch(err){ fail(err); }
}

function bindVerify(box, w, after){

const CFG_DEFAULT = { general:{name_th:'ระบบบำรุงรักษาอุปกรณ์',name_en:'Maintenance System',short_name:'MS',org_name:''},
  targets:{sla_default_hours:72,availability_target:95,pm_ahead_days:7,pm_compliance_target:90,sla_target:90,critical_sla_factor:0.5},
  notify:{urgent:true,overdue:true,equipment_down:true,low_stock:true,pm_due:true,unassigned:true,unassigned_minutes:30} };
S.cfg = JSON.parse(JSON.stringify(CFG_DEFAULT));
async function loadCfg(){
  try { const { data } = await sb.from('app_settings').select('key,value');
    (data||[]).forEach(r=>{ S.cfg[r.key] = { ...(CFG_DEFAULT[r.key]||{}), ...r.value }; }); } catch {}
  document.title = S.cfg.general.name_en || 'Maintenance System';
}
const brandHTML = (sub) => `<div class="brand-mark">${esc((S.cfg.general.short_name||'MS').slice(0,4))}</div><div><b>${esc(S.cfg.general.name_en||'Maintenance System')}</b><small>${esc(sub ?? S.cfg.general.name_th)}</small></div>`;
function footerHTML(){
  const g=S.cfg.general; return `<footer class="foot-bar small"><span>© ${new Date().getFullYear()} ${esc(g.org_name||g.name_en)} · ${esc(g.name_th)}</span><span>เวอร์ชัน ${APP_VERSION}</span></footer>`;
}
let alertTimer = null;
async function refreshAlerts(){
  const el = $('#bellCount'); if (!el) return;
  const n = S.cfg.notify, now = new Date().toISOString(), items = [];
  const base = () => { let x = sb.from('work_orders').select('id,code,title,priority,created_at,due_date,equipment_down,assigned_to').in('status',OPEN); if (isTech()) x = x.or(`assigned_to.eq.${uid()},assigned_to.is.null`); return x; };
  const jobs = [];
  if (n.urgent) jobs.push(base().eq('priority','urgent').limit(20).then(r=>(r.data||[]).forEach(w=>items.push({k:'urgent',t:`งานด่วนมาก ${w.code}`,d:w.title,wo:w.id,at:w.created_at}))));
  if (n.equipment_down) jobs.push(base().eq('equipment_down',true).limit(20).then(r=>(r.data||[]).forEach(w=>items.push({k:'down',t:`เครื่องหยุด ${w.code}`,d:w.title,wo:w.id,at:w.created_at}))));
  if (n.overdue) jobs.push(base().lt('due_date',now).limit(20).then(r=>(r.data||[]).forEach(w=>items.push({k:'overdue',t:`เกินกำหนด ${w.code}`,d:w.title,wo:w.id,at:w.due_date}))));
  if (n.unassigned && can('wo.assign')) jobs.push(sb.from('work_orders').select('id,code,title,created_at').in('status',OPEN).is('assigned_to',null).lt('created_at', new Date(Date.now()-(n.unassigned_minutes||30)*6e4).toISOString()).limit(20)
      .then(r=>(r.data||[]).forEach(w=>items.push({k:'unassigned',t:`ยังไม่มอบหมาย ${w.code}`,d:`${w.title} · รอมาแล้ว ${timeAgo(w.created_at)}`,wo:w.id,at:w.created_at}))));
  if (n.low_stock && (can('part.view')||can('part.manage'))) jobs.push(sb.from('spare_parts').select('id,part_code,name,quantity_on_hand,reorder_point,unit').eq('is_low',true).order('quantity_on_hand').limit(30).then(r=>(r.data||[]).forEach(p=>items.push({k:'stock',t:`อะไหล่ใกล้หมด ${p.part_code}`,d:`${p.name} คงเหลือ ${fmtN(p.quantity_on_hand,2)} ${p.unit}`,href:'#parts'}))));
  if (n.pm_due && (can('pm.view')||can('pm.manage'))) jobs.push(sb.from('pm_schedules').select('id,name,next_due_date').eq('active',true).lte('next_due_date',today()).limit(20).then(r=>(r.data||[]).forEach(p=>items.push({k:'pm',t:`PM ถึงกำหนด`,d:`${p.name} · ${fmtD(p.next_due_date)}`,href:'#pm'}))));
  if (can('wo.approve')) jobs.push(sb.from('work_orders').select('id,code,title,completed_at').eq('status','done').order('completed_at').limit(20)
      .then(r=>(r.data||[]).forEach(w=>items.push({k:'verify',t:`รอตรวจรับ ${w.code}`,d:`${w.title} · รอมา ${timeAgo(w.completed_at)}`,wo:w.id,at:w.completed_at}))));
  await Promise.allSettled(jobs);
  const seen = new Set(); const list = items.filter(i=>{ const key=(i.wo||i.href)+i.k; if (seen.has(key)) return false; seen.add(key); return true; });
  const order = {down:0,urgent:1,overdue:2,verify:3,unassigned:4,pm:5,stock:6}; list.sort((a,b)=>order[a.k]-order[b.k]);
  S.alerts = list; el.hidden = !list.length; el.textContent = list.length>99?'99+':list.length;
  if (!$('#bellPanel').hidden) paintBell();
}
function paintBell(){
  const p = $('#bellPanel'); const L = S.alerts||[];
  const TAG = {down:['หยุด','bad'],urgent:['ด่วน','bad'],overdue:['เกินกำหนด','warn'],unassigned:['รอมอบหมาย','warn'],verify:['ตรวจรับ','info'],pm:['PM','ok'],stock:['อะไหล่','info']};
  p.innerHTML = `<div class="card-head" style="padding:12px 14px 8px"><h3>การแจ้งเตือน</h3>${can('setting.manage')?'<a class="small" href="#settings" data-bset>ตั้งค่า</a>':''}</div>
    ${L.length?`<ul class="bell-list">${L.slice(0,30).map((i,ix)=>`<li><button data-bi="${ix}"><span class="al-tag ${TAG[i.k][1]}">${TAG[i.k][0]}</span><span><b>${esc(i.t)}</b><span class="small muted">${esc(i.d||'')}</span></span></button></li>`).join('')}</ul>`:'<div class="empty">ไม่มีเรื่องที่ต้องดำเนินการ</div>'}`;
  $$('[data-bi]',p).forEach(b=>b.onclick=()=>{ const i=L[b.dataset.bi]; p.hidden=true; if (i.wo) openWO(i.wo); else location.hash=i.href; });
  const bs=$('[data-bset]',p); if (bs) bs.onclick=()=>{ settingsTab='notify'; p.hidden=true; };
}

    $('#sysRe').onclick=again;
    $('#expEq').onclick=async()=>{ try { const {data}=await q(sb.from('equipment').select('asset_code,name,category,status,manufacturer,model,serial_number,purchase_date,warranty_expiry,notes,location:location_id(name)').order('asset_code').limit(20000));
      downloadCsv(`equipment-${today()}.csv`, [['รหัสทรัพย์สิน','ชื่อ','หมวด','สถานะ','ยี่ห้อ','รุ่น','Serial','วันที่ซื้อ','ประกันถึง','พื้นที่','หมายเหตุ'], ...data.map(e=>[e.asset_code,e.name,e.category,e.status,e.manufacturer,e.model,e.serial_number,e.purchase_date,e.warranty_expiry,e.location?.name,e.notes])]); } catch(e){ fail(e); } };
    $('#expPt').onclick=async()=>{ try { const data=[]; for (let i=0;;i+=1000) { const {data:d}=await q(sb.from('spare_parts').select('*').order('part_code').range(i,i+999)); data.push(...d); if (d.length<1000) break; }
      downloadCsv(`spare-parts-${today()}.csv`, [['Part No','Item code','ชื่อ','รุ่น','สเปก','หมวด','หน่วย','คงเหลือ','Safety','Min','Max','Reorder point','ราคา/หน่วย','ที่เก็บ','ผู้จำหน่าย'], ...data.map(p=>[p.part_code,p.item_code,p.name,p.model,p.spec,p.category,p.unit,p.quantity_on_hand,p.safety_stock,p.min_qty,p.max_qty,p.reorder_point,p.unit_cost,p.storage_location,p.supplier])]); } catch(e){ fail(e); } };
  }

  else if (settingsTab==='users') { location.hash = '#users'; }
};

const userFilter = { term:'', role:'', st:'on' };
PAGES.users = async () => {
  if (role()!=='admin') { $('#view').innerHTML = '<section class="card"><div class="empty">หน้านี้สำหรับผู้ดูแลระบบเท่านั้น</div></section>'; return; }
  $('#view').innerHTML = `<div class="page-head"><div><h1>จัดการบัญชีผู้ใช้งาน</h1><p>เพิ่ม ลบ แก้ไขบทบาท และตั้งรหัสผ่านให้ผู้ใช้ · กำหนดสิทธิ์ของแต่ละบทบาท</p></div></div><div id="usersBody"><div class="loading">กำลังโหลด…</div></div>`;
  await usersPage($('#usersBody'));
};
async function usersPage(B, again = () => PAGES.users().catch(fail)){
  const [{data:people},{data:auth},{data:perms},{data:open}] = await Promise.all([
    q(sb.from('profiles').select('*').order('full_name')), q(sb.rpc('admin_list_users')), q(sb.from('role_permissions').select('*')),
    q(sb.from('work_orders').select('assigned_to').in('status',OPEN).not('assigned_to','is',null).limit(10000)) ]);
  S.people = people;
  const A = Object.fromEntries((auth||[]).map(a=>[a.id,a]));
  const openBy = {}; (open||[]).forEach(w=>openBy[w.assigned_to]=(openBy[w.assigned_to]||0)+1);
  const since30 = Date.now()-30*864e5;
  const f = userFilter;
  const rows = people.filter(p=>(!f.role||p.role===f.role) && (!f.st||(f.st==='on'?p.active:!p.active))
    && (!f.term || [p.username,p.full_name,A[p.id]?.email,p.position].some(v=>(v||'').toLowerCase().includes(f.term.toLowerCase()))));
  const RC = { admin:'st-cancelled-bad', manager:'st-in_progress', engineer:'st-done', supervisor:'st-assigned', technician:'st-new', reporter:'st-closed', requester:'st-on_hold' };
  const roleCount = r => people.filter(p=>p.role===r && p.active).length;
  const pr = new Set(perms.filter(x=>x.role===permRole).map(x=>x.perm));
  const strayApprove = [...new Set(perms.filter(x=>x.perm==='wo.approve' && !VERIFY_ROLES.includes(x.role)).map(x=>x.role))];
  B.innerHTML = `
  <section class="kpis k4">
    ${kpi('tech','ผู้ใช้ทั้งหมด', people.length, '', 'บัญชีในระบบ', 'accent')}
    ${kpi('check','บัญชีที่ใช้งานได้', people.filter(p=>p.active).length, '', `ปิดใช้งาน ${people.filter(p=>!p.active).length} บัญชี`, 'ok')}
    ${kpi('pulse','ล็อกอินใน 30 วัน', people.filter(p=>A[p.id]?.last_sign_in_at && new Date(A[p.id].last_sign_in_at).getTime()>=since30).length, '', 'ผู้ใช้ที่เข้าระบบล่าสุด', 'info')}
    ${kpi('sla','บทบาททั้งหมด', ROLE_ORDER.length, '', 'ปรับสิทธิ์ได้ด้านล่าง', 'violet')}
  </section>
  <section class="card">
    <div class="card-head"><h2>พบ ${rows.length} บัญชี</h2><div class="row"><button class="btn sm" id="uImp">${svgI('download')} นำเข้ารายชื่อพนักงาน (Excel)</button><button class="btn primary sm" id="uAdd">+ เพิ่มผู้ใช้</button></div></div>
    <div class="pm-filters uf">
      <label class="field"><span>ค้นหา</span><input class="input" id="uf-term" placeholder="ชื่อผู้ใช้ / ชื่อ / อีเมล" value="${esc(f.term)}"></label>
      <label class="field"><span>บทบาท</span><select class="input" id="uf-role"><option value="">ทุกบทบาท</option>${ROLE_ORDER.map(r=>`<option value="${r}" ${r===f.role?'selected':''}>${ROLE[r]}</option>`).join('')}</select></label>
      <label class="field"><span>สถานะ</span><select class="input" id="uf-st"><option value="" ${f.st===''?'selected':''}>ทุกสถานะ</option><option value="on" ${f.st==='on'?'selected':''}>ใช้งานอยู่</option><option value="off" ${f.st==='off'?'selected':''}>ปิดใช้งาน / ลบแล้ว</option></select></label>
      ${f.term||f.role||f.st!=='on'?'<button class="btn" id="uf-clear" style="align-self:end">ล้างตัวกรอง</button>':''}
    </div>
    <div class="tbl-wrap"><table class="compact"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ-นามสกุล</th><th>ตำแหน่ง</th><th>บทบาท</th><th>ทีม</th><th>อีเมล</th><th class="num">งานค้าง</th><th>ล็อกอินล่าสุด</th><th>สถานะ</th><th></th></tr></thead><tbody>
    ${rows.map(p=>{ const a=A[p.id]; const internal=(a?.email||'').endsWith('@mms.internal'); return `<tr class="${p.active?'':'is-off'}">
      <td class="mono">${esc(p.username)}${p.id===uid()?' <span class="pill st-new plain">คุณ</span>':''}</td><td>${esc(p.full_name)}</td><td>${esc(p.position||'–')}</td>
      <td><span class="pill plain ${RC[p.role]}">${ROLE[p.role]}</span></td><td>${esc(S.teams.find(t=>t.id===p.team_id)?.name||'–')}</td>
      <td class="small ${internal?'muted':''}">${internal?'–':esc(a?.email||'–')}</td><td class="num mono">${openBy[p.id]||0}</td>
      <td class="small">${a?.last_sign_in_at?fmtDT(a.last_sign_in_at):'<span class="muted">ยังไม่เคย</span>'}</td>
      <td><span class="pill ${p.active?'st-done':'st-closed'}">${p.active?'ใช้งาน':'ปิดใช้งาน'}</span></td>
      <td><div class="acts"><button class="icon-btn" data-uedit="${p.id}" title="แก้ไขข้อมูลและสิทธิ์">${svgI('edit')}</button><button class="icon-btn" data-upw="${p.id}" title="ตั้งรหัสผ่านใหม่">${svgI('key')}</button>${p.id===uid()?'':p.active?`<button class="icon-btn del" data-udel="${p.id}" title="ลบบัญชี">${svgI('trash')}</button>`:`<button class="icon-btn" data-uon="${p.id}" title="เปิดใช้งานอีกครั้ง">${svgI('check')}</button>`}</div></td></tr>`; }).join('')}
    </tbody></table></div>
  </section>
  <section class="card">
    <div class="card-head"><div><h2>สิทธิ์ตามบทบาท</h2><p class="small muted" style="margin:4px 0 0">กำลังแก้ไขสิทธิ์ของบทบาท <b style="color:var(--accent)">${ROLE[permRole]}</b> — มีผู้ใช้ ${roleCount(permRole)} คน</p></div>
      <div class="row">${ROLE_ORDER.map(r=>`<button class="qchip ${permRole===r?'on':''}" data-prole="${r}">${ROLE[r]} <b>${roleCount(r)}</b></button>`).join('')}</div></div>
    ${strayApprove.length?`<div class="note warn row" style="justify-content:space-between">บทบาท ${strayApprove.map(r=>ROLE[r]).join(', ')} ยังมีสิทธิ์ตรวจรับงานค้างอยู่ในฐานข้อมูล — ตามนโยบาย ให้เฉพาะผู้ดูแลระบบ, Senior Engineer และ Engineer<button class="btn sm primary" id="permFixApprove">นำสิทธิ์ตรวจรับออก</button></div>`:''}
    ${permRole==='admin'?'<div class="note">ผู้ดูแลระบบมีสิทธิ์ทั้งหมดเสมอ และแก้ไขไม่ได้ เพื่อป้องกันไม่ให้ระบบไม่มีผู้ดูแล</div>':''}
    <div class="perm-grid">${PERM_GROUPS.map(([g,list])=>`<div class="perm-box"><h3>${g}</h3>${list.map(([k,l])=>`<label class="perm-row"><span class="check"><input type="checkbox" data-perm="${k}" ${k==='wo.approve' ? (VERIFY_ROLES.includes(permRole)?'checked':'') : k==='user.manage' ? (permRole==='admin'?'checked':'') : (permRole==='admin'||pr.has(k)?'checked':'')} ${permRole==='admin'||k==='wo.approve'||k==='user.manage'?'disabled':''}> ${l}${k==='user.manage'?' <span class="small muted" title="ล็อกไว้: เฉพาะผู้ดูแลระบบ">🔒</span>':''}${k==='wo.approve'?' <span class="small muted" title="ล็อกไว้: เฉพาะผู้ดูแลระบบ, Senior Engineer และ Engineer">🔒</span>':''}</span><code>${k}</code></label>`).join('')}</div>`).join('')}</div>
    ${permRole!=='admin'?`<div class="row"><button class="btn" id="permPreset">${svgI('check')} ใช้สิทธิ์มาตรฐานของทุกตำแหน่ง</button><button class="btn primary" id="permSave">${svgI('check')} บันทึกสิทธิ์ของบทบาทนี้</button><span class="small muted">มีผลทันทีกับผู้ใช้ในบทบาทนี้ (ผู้ใช้ต้องรีเฟรชหน้าเว็บ)</span></div>`:''}
  </section>`;
  let tm; $('#uf-term').oninput=e=>{ clearTimeout(tm); tm=setTimeout(()=>{ f.term=e.target.value.trim(); again().then(()=>{ const i=$('#uf-term'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }); },300); };
  $('#uf-role').onchange=e=>{ f.role=e.target.value; again(); };
  $('#uf-st').onchange=e=>{ f.st=e.target.value; again(); };
  if ($('#uf-clear')) $('#uf-clear').onclick=()=>{ Object.assign(f,{term:'',role:'',st:'on'}); again(); };
  $('#uAdd').onclick=()=>techForm();
  $('#uImp').onclick=()=>userImport(people, again);
  $$('[data-uedit]').forEach(b=>b.onclick=()=>{ const p=people.find(x=>x.id===b.dataset.uedit); techDetail({p,open:openBy[p.id]||0,over:0,done30:0,mttr:null}); });
  $$('[data-udel]').forEach(b=>b.onclick=()=>{ const p=people.find(x=>x.id===b.dataset.udel);
    openPanel('ลบบัญชีผู้ใช้', `${esc(p.full_name)} · <span class="mono">${esc(p.username)}</span>`, `<section class="card"><p>ต้องการลบบัญชี <b>${esc(p.full_name)}</b> (${ROLE[p.role]||p.role}) ใช่ไหม?</p>
      <div class="note small">ถ้าบัญชีนี้เคยมีประวัติงานในระบบ จะถูกปิดใช้งานและซ่อนจากรายชื่อแทนการลบ เพื่อให้ใบงานเก่ายังแสดงชื่อผู้ซ่อม/ผู้ตรวจได้ · ผู้ใช้จะเข้าสู่ระบบไม่ได้อีก${openBy[p.id]?`<br><b>มีงานค้างในมือ ${openBy[p.id]} งาน</b> — ควรมอบหมายให้คนอื่นก่อน`:''}</div>
      <div class="row"><button class="btn danger" id="udGo">${svgI('trash')} ยืนยันลบบัญชี</button><button class="btn" id="udNo">ยกเลิก</button></div></section>`);
    $('#udNo').onclick=closePanel;
    $('#udGo').onclick=async()=>{ $('#udGo').disabled=true; try { const {data:r}=await q(sb.rpc('admin_delete_user',{p_user:p.id})); await loadRefs().catch(()=>{}); closePanel();
      toast(r==='deleted'?`ลบบัญชี ${p.username} แล้ว`:`ลบ ${p.username} ออกจากรายชื่อแล้ว (เก็บประวัติงานไว้)`); again(); } catch(err){ fail(err); $('#udGo').disabled=false; } }; });
  $$('[data-uon]').forEach(b=>b.onclick=async()=>{ try { await q(sb.rpc('admin_set_active',{p_user:b.dataset.uon,p_active:true})); await loadRefs().catch(()=>{}); toast('เปิดใช้งานบัญชีอีกครั้งแล้ว'); again(); } catch(err){ fail(err); } });
  $$('[data-upw]').forEach(b=>b.onclick=()=>{ const p=people.find(x=>x.id===b.dataset.upw);
    openPanel('ตั้งรหัสผ่านใหม่', `${esc(p.full_name)} · <span class="mono">${esc(p.username)}</span>`, `<form class="card" id="pwForm"><label class="field"><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</span><input class="input mono" id="pw-new" minlength="8" required autocomplete="new-password"></label><div class="row"><button class="btn primary">ตั้งรหัสผ่าน</button></div></form>`);
    $('#pwForm').onsubmit=async e=>{ e.preventDefault(); try { await q(sb.rpc('admin_set_password',{p_user:p.id,p_password:$('#pw-new').value})); closePanel(); toast('ตั้งรหัสผ่านใหม่แล้ว'); } catch(err){ fail(err); } }; });
  $$('[data-prole]').forEach(b=>b.onclick=()=>{ permRole=b.dataset.prole; again(); });
  if ($('#permFixApprove')) $('#permFixApprove').onclick=async()=>{ try {
      for (const r of strayApprove) await q(sb.rpc('set_role_permissions',{p_role:r,p_perms:perms.filter(x=>x.role===r && x.perm!=='wo.approve').map(x=>x.perm)}));
      toast('นำสิทธิ์ตรวจรับงานออกจาก '+strayApprove.map(r=>ROLE[r]).join(', ')+' แล้ว'); again(); } catch(err){ fail(err); } };
  if ($('#permPreset')) $('#permPreset').onclick=async()=>{ try {
      for (const [r,list] of Object.entries(ROLE_PRESET)) await q(sb.rpc('set_role_permissions',{p_role:r,p_perms:list}));
      toast('ตั้งสิทธิ์มาตรฐานให้ทุกตำแหน่งแล้ว (ผู้ใช้ต้องรีเฟรชหน้าเว็บ)'); again(); } catch(err){ fail(err); } };
  if ($('#permSave')) $('#permSave').onclick=async()=>{ const list=$$('[data-perm]').filter(i=>i.checked).map(i=>i.dataset.perm);
    try { await q(sb.rpc('set_role_permissions',{p_role:permRole,p_perms:list})); toast(`บันทึกสิทธิ์ของ ${ROLE[permRole]} แล้ว`); again(); } catch(err){ fail(err); } };
}

window.onhashchange = () => { if (!S.profile) boot(); };
boot();
</script>
