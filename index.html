<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13202C">
<title>Maintenance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F5F8FA; --ink:#13202C; --ink-2:#4B5C6B; --ink-3:#7A8A98;
  --line:#D6DEE5; --accent:#0B6E99; --accent-soft:#E1EFF6; --accent-ink:#FFFFFF;
  --side:#13202C; --side-ink:#C9D6E1; --side-hi:#FFFFFF; --hazard:#E8A317;
  --ok:#1F8A5B; --ok-soft:#E2F3EA; --warn:#B87D00; --warn-soft:#FBF0D6; --bad:#C23B3B; --bad-soft:#F9E3E3;
  --info:#3A5FC0; --info-soft:#E4EAF9; --mute-soft:#E9EDF1;
  --shadow:0 1px 2px rgba(19,32,44,.06),0 4px 16px rgba(19,32,44,.06);
  --r:10px; --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#16202A; --surface-2:#1B2733; --ink:#E3EBF1; --ink-2:#A2B3C2; --ink-3:#72859A;
  --line:#2A3948; --accent:#43A7D8; --accent-soft:#16344A; --accent-ink:#06141D;
  --side:#0A1117; --side-ink:#9FB1C1; --side-hi:#FFFFFF;
  --ok:#43BE88; --ok-soft:#133426; --warn:#E3B03A; --warn-soft:#3A2E10; --bad:#EE7373; --bad-soft:#3D1A1C;
  --info:#7E9CF0; --info-soft:#1C2847; --mute-soft:#223040; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16202A; --surface-2:#1B2733; --ink:#E3EBF1; --ink-2:#A2B3C2; --ink-3:#72859A;
  --line:#2A3948; --accent:#43A7D8; --accent-soft:#16344A; --accent-ink:#06141D;
  --side:#0A1117; --side-ink:#9FB1C1; --side-hi:#FFFFFF;
  --ok:#43BE88; --ok-soft:#133426; --warn:#E3B03A; --warn-soft:#3A2E10; --bad:#EE7373; --bad-soft:#3D1A1C;
  --info:#7E9CF0; --info-soft:#1C2847; --mute-soft:#223040; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
#root{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--side);color:var(--side-ink);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,#13202C 14px 28px)}
.login-art h1{color:#fff;font-size:clamp(26px,3.4vw,38px);font-weight:700;max-width:16ch}
.login-art p{max-width:46ch}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand-mark{width:38px;height:38px;border-radius:8px;background:var(--hazard);display:grid;place-items:center;color:#13202C;font:700 14px var(--mono)}
.brand small{display:block;color:var(--side-ink);font-size:12px}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px}
.kpi-strip div{border:1px solid #2A3A4A;border-radius:8px;padding:12px}
.kpi-strip b{display:block;color:#fff;font:600 18px var(--mono)}
.login-form{display:grid;place-items:center;padding:32px 16px;background:var(--bg)}
.login-card{width:100%;max-width:380px;display:grid;gap:18px}
.login-card .foot{font-size:12px;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:20px;padding:20px 12px;position:sticky;top:0;height:100vh}
.side .brand{padding:0 8px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--hazard)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--hazard);color:#13202C;border-radius:99px;padding:0 7px;font:600 11px/18px var(--mono)}
.side .me{margin-top:auto;border-top:1px solid #253545;padding:14px 8px 0;display:grid;gap:6px;font-size:13px}
.side .me b{color:#fff;font-weight:600}
.side .me button{background:none;border:1px solid #33475A;color:var(--side-ink);border-radius:6px;padding:5px 10px;cursor:pointer;justify-self:start}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.topbar .grow{flex:1}
.content{padding:24px;display:grid;gap:20px;align-content:start}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head p{margin:4px 0 0;color:var(--ink-2)}

/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg,.qchip svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:grid;gap:5px}
.field > span{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;min-height:38px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .v{font:600 26px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tile .v small{font:500 13px var(--font);color:var(--ink-2);margin-left:4px}
.tile .s{font-size:12px;color:var(--ink-2)}
.tile.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:linear-gradient(var(--bad-soft),var(--bad-soft)) top/100% 3px no-repeat,var(--surface)}
.tile.warn{background:linear-gradient(var(--warn),var(--warn)) top/100% 3px no-repeat,var(--surface)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.card table th{background:none}
.card .tbl-wrap{border:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.plain::before{display:none}
.st-new{background:var(--info-soft);color:var(--info)}
.st-assigned{background:var(--accent-soft);color:var(--accent)}
.st-in_progress{background:var(--warn-soft);color:var(--warn)}
.st-on_hold{background:var(--mute-soft);color:var(--ink-2)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-closed{background:var(--mute-soft);color:var(--ink-3)}
.st-cancelled{background:var(--mute-soft);color:var(--ink-3);text-decoration:line-through}
.pr{font:600 11px var(--mono);letter-spacing:.03em;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.pr-urgent{color:var(--bad);background:var(--bad-soft)}
.pr-high{color:var(--warn)}
.pr-medium{color:var(--accent)}
.pr-low{color:var(--ink-3)}
.sla{font:500 12px var(--mono);white-space:nowrap}
.sla.ok{color:var(--ok)} .sla.warn{color:var(--warn)} .sla.bad{color:var(--bad);font-weight:600}
.down{color:var(--bad);font-size:12px;font-weight:600;white-space:nowrap}
.team-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;margin-bottom:-1px}
.tabs button.on{border-color:var(--accent);color:var(--ink)}
.tabs .c{font:500 11px var(--mono);color:var(--ink-3);margin-left:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .input{width:auto;min-width:150px}
.toolbar .search{flex:1;min-width:200px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:var(--mute-soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font:10px var(--mono)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* panel (drawer) */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.panel-body{overflow-y:auto;padding:20px;display:grid;gap:16px;align-content:start;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline .t{font-size:12px;color:var(--ink-3)}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:30}
.combo-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.combo-list button:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.checklist{margin:0;padding-left:20px}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.swatch{width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}


/* ---------- header, form, tech, calendar, reports ---------- */
.crumb-wrap{display:grid;line-height:1.25;min-width:0}
.crumb-wrap small{font-size:11.5px;color:var(--ink-3)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn svg{width:17px;height:17px}
.bc{display:flex;gap:8px;color:var(--ink-3)} .bc a{text-decoration:none}
.nf-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.nf-grid h2{margin-bottom:2px}
.nf-side{position:sticky;top:84px}
.nf-actions .btn.primary{flex:1}
.nf-actions svg{width:16px;height:16px}
.req{color:var(--bad);font-style:normal}
.hint{font-size:11.5px;color:var(--ink-3)} .hint b{color:var(--accent);font-weight:500}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tech-head{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:16px}
.tech-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.tech-kv div{background:var(--surface-2);border-radius:8px;padding:8px}
.tech-kv dt{font-size:11px;color:var(--ink-3)} .tech-kv dd{margin:0;font-weight:600}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px;min-width:700px}
.cal-h{background:var(--surface-2);padding:8px;font-size:12px;font-weight:600;color:var(--ink-2);text-align:center}
.cal-c{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-c.out{background:var(--surface-2)} .cal-c.out .cal-d{color:var(--ink-3)}
.cal-d{font:500 12px var(--mono);align-self:flex-end;padding:1px 6px;border-radius:99px}
.cal-c.today .cal-d{background:var(--accent);color:var(--accent-ink)}
.chip{border:0;text-align:left;font-size:11px;line-height:1.35;padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.c-pm{background:var(--ok-soft);color:var(--ok)} .c-hot{background:var(--bad-soft);color:var(--bad)} .c-wo{background:var(--accent-soft);color:var(--accent)} .c-done{background:var(--mute-soft);color:var(--ink-3);text-decoration:line-through}
.rep-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
table.rep td,table.rep th{padding:8px 10px;font-size:12.5px}
table.rep th.num,table.rep td.num{text-align:right}
table.rep tr.tot td{font-weight:600;background:var(--surface-2)}
@media (max-width:1100px){.nf-grid{grid-template-columns:1fr}.nf-side{position:static}.rep-grid{grid-template-columns:1fr}}


.kpi-of{font-size:16px;color:var(--ink-3)}
.pm-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.qchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--ink-2);text-decoration:none}
.qchip svg{width:14px;height:14px}
.qchip b{font-family:var(--mono);color:var(--ink)}
.qchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pm-filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
.pm-tbl td{vertical-align:middle}
.acts{display:flex;gap:6px}
.acts .icon-btn{width:30px;height:30px}
.acts .icon-btn svg{width:15px;height:15px}
.st-cancelled-bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:900px){.pm-filters{grid-template-columns:1fr 1fr}}

.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tech-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.tech-main,.tech-side{display:grid;gap:16px}
.pm-filters.tf{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto auto}
.tech-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tcard{gap:12px}
.tcard.is-off{opacity:.6}
.tcard .tech-head{grid-template-columns:40px minmax(0,1fr) auto}
.lead{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,#7A5BD6 18%,var(--surface));color:#7A5BD6}
.tload{display:grid;justify-items:end;line-height:1.2}
.tload b{font-size:20px;color:var(--bad)}
.bar.thin{height:4px}
.tstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tstats div{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;justify-items:center;gap:2px;background:var(--surface-2)}
.tstats span{font-size:11px;color:var(--ink-3)}
.tstats b{font-size:16px}
.tfoot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px;color:var(--ink-2)}
.tfoot b{color:var(--ink)}
.tfoot a{margin-left:auto;text-decoration:none}
.tteams{display:grid;gap:14px}
@media (max-width:1400px){.tech-cards{grid-template-columns:1fr}}

let booting = false;
async function boot(){
  if (location.hash === '#report') { await loadCfg(); return renderPublicReport(); }
  if (booting) return; booting = true;
  try { await bootInner(); } finally { booting = false; }
}
async function bootInner(){
  await loadCfg();
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session;
  if (!session) return renderLogin();
  try {
    const { data } = await q(sb.from('profiles').select('*').eq('id', session.user.id).single());
    S.profile = data;
    S.perms = new Set((await sb.rpc('my_perms')).data || []);
    if (!data.active) { await sb.auth.signOut(); return renderLogin('บัญชีนี้ถูกปิดการใช้งาน'); }
    await loadRefs();
    renderShell();
  } catch (e) { fail(e); renderLogin(thaiErr(e)); }
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_IN' && !S.profile) { S.session = session; boot(); }
  if (ev === 'SIGNED_OUT') { S.session=null; S.profile=null; renderLogin(); }
});

function bindEquipCombo(id, onPick){
  const inp=$('#'+id), list=$('#'+id+'-list'), val=$('#'+id+'-val'); let timer;
  inp.addEventListener('input', () => {
    val.value=''; clearTimeout(timer);
    const term = inp.value.trim().replace(/[,()%]/g,' ');
    if (term.length < 1) { list.hidden=true; return; }
    timer = setTimeout(async () => {
      const { data } = await sb.from('equipment').select('id,asset_code,name,location_id,category').or(`asset_code.ilike.%${term}%,name.ilike.%${term}%`).neq('status','retired').order('asset_code').limit(20);
      list.innerHTML = (data||[]).map(e=>`<button type="button" data-id="${e.id}"><span class="mono">${esc(e.asset_code)}</span> · ${esc(e.name)} <span class="small muted">${esc(e.category||'')}</span></button>`).join('') || '<div class="empty">ไม่พบอุปกรณ์</div>';
      list.hidden=false;
      $$('button',list).forEach(b=>b.onclick=()=>{ const e=data.find(x=>x.id===b.dataset.id); inp.value=e.asset_code+' · '+e.name; val.value=e.id; list.hidden=true; onPick&&onPick(e); });
    }, 220);
  });
  inp.addEventListener('blur', ()=>setTimeout(()=>list.hidden=true, 200));
}

function kpi(icon, label, value, unit, sub, tone){
  return `<div class="kpi"><span class="kpi-ic tone-${tone}">${svgI(icon)}</span><div class="kpi-b"><span class="kpi-l">${label}</span>
    <span class="kpi-v tone-t-${tone}">${value}${unit?`<small>${unit}</small>`:''}</span><span class="kpi-s">${sub||'&nbsp;'}</span></div></div>`;
}
function delta(cur, prev, unit, higherBetter, txt){
  if (cur==null || prev==null) return `<span class="muted">ยังไม่มีข้อมูลช่วงก่อนหน้าให้เทียบ</span>`;
  const df_ = cur - prev; if (Math.abs(df_) < 0.05) return `<span class="muted">เท่าเดิม ${txt}</span>`;
  const good = higherBetter ? df_>0 : df_<0;
  return `<span style="color:${good?'var(--ok)':'var(--bad)'}">${df_>0?'↑':'↓'} ${fmtN(Math.abs(df_),1)} ${unit}</span> <span class="muted">${txt}</span>`;
}
function timeAgo(t){
  const m = (Date.now() - new Date(t).getTime())/6e4;
  if (m < 60) return Math.max(1,Math.round(m))+' นาที';
  if (m < 1440) return Math.round(m/60)+' ชม.';
  return Math.round(m/1440)+' วัน';
}
function donut(segs, center, sub, centerColor){
  const R=42, C=2*Math.PI*R; const tot = segs.reduce((a,s)=>a+s.v,0);
  let off=0, arcs='';
  if (tot>0) segs.filter(s=>s.v>0).forEach(s=>{ const len=s.v/tot*C; arcs += `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${s.c}" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off+=len; });
  return `<svg class="donut" viewBox="0 0 120 120" role="img"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--mute-soft)" stroke-width="14"/>${arcs}
    <text x="60" y="60" text-anchor="middle" class="dn-v" style="fill:${centerColor||'var(--ink)'}">${esc(center)}</text><text x="60" y="76" text-anchor="middle" class="dn-l">${esc(sub)}</text></svg>`;
}
function hbars(rows, color, emptyTxt){
  if (!rows?.length) return `<div class="empty">${emptyTxt}</div>`;
  const max = Math.max(...rows.map(r=>r.n));
  return `<div class="hbars">${rows.map(r=>`<div class="hb"><span class="hb-l" title="${esc(r.name)}">${esc(r.name)}</span><div class="hb-t"><i style="width:${r.n/max*100}%;background:${color}"></i></div><b class="mono">${r.n}</b></div>`).join('')}</div>`;
}
function lineChart(labels, series, rows, monthly){
  const W=420,H=190,L=28,R=10,T=12,B=26, iw=W-L-R, ih=H-T-B;
  const vals = rows.flatMap(r=>series.map(s=>Number(r[s.k])||0));
  const max = Math.max(monthly?1:4, ...vals); const step = monthly ? Math.max(0.5, Math.ceil(max/4*2)/2) : Math.ceil(max/4); const top = step*4;
  const x = i => L + (labels.length<2 ? iw/2 : i*iw/(labels.length-1));
  const y = v => T + ih - v/top*ih;
  let g='';
  for (let i=0;i<=4;i++){ const v=step*i; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${i?'3 3':''}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fmtN(v,1)}</text>`; }
  const every = monthly ? 1 : 2;
  labels.forEach((l,i)=>{ if (i%every===0 || i===labels.length-1) { const t = monthly ? new Intl.DateTimeFormat('th-TH',{month:'short'}).format(new Date(l+'-01T00:00:00')) : (()=>{const dd=new Date(l+'T00:00:00');return dd.getDate()+'/'+(dd.getMonth()+1);})(); g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${t}</text>`; } });
  series.forEach(s=>{
    const pts = rows.map((r,i)=>[x(i), r[s.k]==null?null:y(Number(r[s.k]))]).filter(p=>p[1]!=null);
    if (!pts.length) return;
    const dpath = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    g += `<path d="${dpath} L${pts[pts.length-1][0]} ${T+ih} L${pts[0][0]} ${T+ih}Z" fill="${s.c}" opacity=".08"/>`;
    g += `<path d="${dpath}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ g += `<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?3.5:2.2}" fill="${s.c}"/>`; });
  });
  if (!vals.some(v=>v>0)) g += `<text x="${L+iw/2}" y="${T+ih/2}" text-anchor="middle" style="font-size:11px">ยังไม่มีข้อมูลในช่วงนี้</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function pctBar(p){ const c = p>=90?'ok':p>=70?'warn':'bad'; return `<div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i class="${c}" style="width:${p}%"></i></div><span class="mono small num" style="width:42px;text-align:right">${fmtN(p,0)}%</span></div>`; }
function sessionGet(k){ try { return sessionStorage.getItem('emm.'+k); } catch { return null; } }
function sessionSet(k,v){ try { sessionStorage.setItem('emm.'+k,v); } catch {} }

function dailyChart(rows){
  rows = rows||[]; if (!rows.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  const W=640,H=220,L=32,R=8,T=10,B=26, iw=W-L-R, ih=H-T-B;
  const max = Math.max(4, ...rows.map(r=>Math.max(r.created,r.completed)));
  const step = Math.ceil(max/4); const top = step*4;
  const bw = iw/rows.length; const gap = Math.min(3, bw*0.2); const b = Math.max(1,(bw-gap*2)/2);
  const y = v => T + ih - v/top*ih;
  let g = '';
  for (let i=0;i<=4;i++){ const v=step*i; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`; }
  const every = Math.ceil(rows.length/8);
  rows.forEach((r,i)=>{
    const x = L + i*bw + gap;
    g += `<rect x="${x}" y="${y(r.created)}" width="${b}" height="${ih - (y(r.created)-T)}" fill="var(--ink-3)" opacity=".55"><title>${fmtD(r.d)} แจ้ง ${r.created}</title></rect>`;
    g += `<rect x="${x+b}" y="${y(r.completed)}" width="${b}" height="${ih - (y(r.completed)-T)}" fill="var(--accent)"><title>${fmtD(r.d)} เสร็จ ${r.completed}</title></rect>`;
    if (i%every===0) { const dd=new Date(r.d+'T00:00:00'); g += `<text x="${x+b}" y="${H-8}" text-anchor="middle">${dd.getDate()}/${dd.getMonth()+1}</text>`; }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟงานรายวัน">${g}</svg>`;
}

const WO_SEL = 'id,code,title,status,priority,source,created_at,due_date,sla_resolve_due,completed_at,equipment_down,assigned_to,equipment:equipment_id(asset_code,name),team:team_id(name,color),assignee:profiles!work_orders_assigned_to_fkey(full_name)';
function woTable(rows, showAssignee=true){
  if (!rows?.length) return '<div class="empty">ไม่มีใบงาน</div>';
  return `<div class="tbl-wrap"><table><thead><tr><th>เลขที่</th><th>เรื่อง / อุปกรณ์</th><th>ความเร่งด่วน</th><th>สถานะ</th>${showAssignee?'<th>ทีม / ผู้รับผิดชอบ</th>':''}<th>SLA</th><th>แจ้งเมื่อ</th></tr></thead><tbody>
  ${rows.map(w=>`<tr class="click" data-wo="${w.id}" tabindex="0">
    <td class="mono">${esc(w.code)}${w.source==='pm'?' <span class="pill plain small">PM</span>':''}</td>
    <td style="min-width:220px"><b style="font-weight:500">${esc(w.title)}</b>${w.equipment_down?' <span class="down">● เครื่องหยุด</span>':''}<div class="small muted">${w.equipment?`<span class="mono">${esc(w.equipment.asset_code)}</span> · ${esc(w.equipment.name)}`:'ไม่ระบุอุปกรณ์'}</div></td>
    <td>${prioTag(w.priority)}</td><td>${statusPill(w.status)}</td>
    ${showAssignee?`<td class="small">${teamTag(w.team)}<div class="muted">${esc(w.assignee?.full_name||'ยังไม่มอบหมาย')}</div></td>`:''}
    <td>${slaTag(w)}</td><td class="small muted" style="white-space:nowrap">${fmtDT(w.created_at)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function bindWoRows(){ $$('[data-wo]').forEach(tr=>{ tr.onclick=()=>openWO(tr.dataset.wo); tr.onkeydown=e=>{ if(e.key==='Enter') openWO(tr.dataset.wo); }; }); }

const woFilter = { tab:'open', prio:'', team:'', mine:false, term:'', page:0, assignee:'' };
const cmFilter = { tab:'open', prio:'', team:'', mine:isTechDefault(), term:'', page:0, assignee:'' };
function isTechDefault(){ return false; }
PAGES.wo = () => woPage('wo', woFilter);
PAGES.repair = () => woPage('repair', cmFilter);
async function woPage(kind, f){
  const size = 50; const again = () => woPage(kind, f);
  let qq = sb.from('work_orders').select(WO_SEL,{count:'exact'});
  if (kind==='repair') qq = qq.neq('source','pm');
  if (f.tab==='open') qq = qq.in('status',OPEN);
  else if (f.tab==='overdue') qq = qq.in('status',OPEN).lt('due_date', new Date().toISOString());
  else if (f.tab==='pm') qq = qq.eq('source','pm');
  else if (f.tab!=='all') qq = qq.eq('status',f.tab);
  if (f.prio) qq = qq.eq('priority',f.prio);
  if (f.team) qq = qq.eq('team_id',f.team);
  if (f.mine) qq = qq.eq('assigned_to', uid());
  if (f.assignee) qq = qq.eq('assigned_to', f.assignee);
  if (f.term) { const t=f.term.replace(/[,()%]/g,' '); qq = qq.or(`code.ilike.%${t}%,title.ilike.%${t}%`); }
  qq = f.tab==='open' ? qq.order('due_date',{ascending:true,nullsFirst:false}) : qq.order('created_at',{ascending:false});
  const { data, count } = await q(qq.range(f.page*size, f.page*size+size-1));
  const tabs = [['open','งานค้าง'],['overdue','เกินกำหนด'],['new','ใหม่'],['assigned','มอบหมายแล้ว'],['in_progress','กำลังซ่อม'],['on_hold','พักงาน'],['done','ซ่อมเสร็จ'],['closed','ปิดงาน'],...(kind==='wo'?[['pm','งาน PM']]:[]),['all','ทั้งหมด']];
  const who = f.assignee ? S.people.find(p=>p.id===f.assignee)?.full_name : '';
  $('#view').innerHTML = `
  <div class="page-head"><div><h1>${kind==='repair'?'งานซ่อม (CM)':'ใบงานทั้งหมด'}</h1><p>${count} รายการ${who?` · ของ ${esc(who)} <a href="#" id="clrWho">ล้างตัวกรอง</a>`:''}${f.tab==='open'?' · เรียงตามกำหนดเสร็จที่ใกล้ที่สุด':''}</p></div><a class="btn primary" href="#new">+ สร้างใบงาน</a></div>
  <div class="tabs" role="tablist">${tabs.map(([k,v])=>`<button data-tab="${k}" class="${f.tab===k?'on':''}">${v}</button>`).join('')}</div>
  <div class="toolbar">
    <input class="input search" id="woTerm" placeholder="ค้นหาเลขที่ใบงาน หรือหัวเรื่อง" value="${esc(f.term)}">
    <select class="input" id="woPrio"><option value="">ทุกความเร่งด่วน</option>${prioOptions(f.prio)}</select>
    <select class="input" id="woTeam">${teamOptions(f.team,'ทุกทีม')}</select>
    ${seesWork()?`<label class="check small"><input type="checkbox" id="woMine" ${f.mine?'checked':''}> เฉพาะงานของฉัน</label>`:''}
  </div>
  ${woTable(data)}
  ${pager(f.page,size,count)}`;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ f.tab=b.dataset.tab; f.page=0; again().catch(fail); });
  let t; $('#woTerm').oninput = e => { clearTimeout(t); t=setTimeout(()=>{ f.term=e.target.value.trim(); f.page=0; again().then(()=>{ const i=$('#woTerm'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }).catch(fail); },350); };
  $('#woPrio').onchange = e => { f.prio=e.target.value; f.page=0; again().catch(fail); };
  $('#woTeam').onchange = e => { f.team=e.target.value; f.page=0; again().catch(fail); };
  if ($('#woMine')) $('#woMine').onchange = e => { f.mine=e.target.checked; f.page=0; again().catch(fail); };
  if ($('#clrWho')) $('#clrWho').onclick = e => { e.preventDefault(); f.assignee=''; again().catch(fail); };
  bindPager(p=>{ f.page=p; again().catch(fail); });
  bindWoRows();
}
function pager(page,size,count){
  if (count <= size) return '';
  const last = Math.ceil(count/size)-1;
  return `<div class="pager"><span class="small muted">แสดง ${page*size+1}–${Math.min(count,(page+1)*size)} จาก ${count}</span><div class="row"><button class="btn sm" data-pg="${page-1}" ${page<=0?'disabled':''}>← ก่อนหน้า</button><button class="btn sm" data-pg="${page+1}" ${page>=last?'disabled':''}>ถัดไป →</button></div></div>`;
}
function bindPager(fn){ $$('[data-pg]').forEach(b=>b.onclick=()=>fn(Number(b.dataset.pg))); }

async function openWO(id){
  const body = openPanel('กำลังโหลด…','', '<div class="loading">กำลังโหลด…</div>');
  try {
    const [{data:w},{data:ev},{data:parts}] = await Promise.all([
      q(sb.from('work_orders').select('*,equipment:equipment_id(id,asset_code,name,category,model,manufacturer),location:location_id(name,building,floor),team:team_id(id,name,color),assignee:profiles!work_orders_assigned_to_fkey(full_name),reporter:profiles!work_orders_reported_by_fkey(full_name)').eq('id',id).single()),
      q(sb.from('work_order_events').select('*,actor:profiles!work_order_events_actor_id_fkey(full_name)').eq('work_order_id',id).order('created_at')),
      !seesWork() ? {data:[]} : q(sb.from('work_order_parts').select('id,quantity_used,used_at,part:part_id(part_code,name,unit,unit_cost)').eq('work_order_id',id).order('used_at'))
    ]);

    renderWO(w, ev||[], parts||[], checklist);
  } catch(e){ closePanel(); fail(e); }
}

  }

  if (w.status==='done' && can('wo.approve')) actions.push(`<button class="btn" data-st="in_progress">ส่งกลับให้ซ่อมต่อ</button>`);
  if (open && can('wo.close')) actions.push(`<button class="btn danger" data-act="cancel">ยกเลิกใบงาน</button>`);

  body.innerHTML = `

  <div id="deleteBox" hidden class="card"><p style="margin:0">ลบใบงาน <b class="mono">${esc(w.code)}</b> ถาวร? ประวัติทั้งหมดจะถูกลบ และอะไหล่ที่เบิกจะคืนเข้าสต็อก</p><div class="row"><button class="btn danger" data-act="deleteGo">ยืนยันลบใบงาน</button><button class="btn" data-act="deleteNo">ไม่ลบ</button></div></div>
  <div id="cancelBox" hidden class="card"><label class="field"><span>เหตุผลที่ยกเลิก</span><input class="input" id="cancelWhy"></label><div class="row"><button class="btn danger" data-act="cancelGo">ยืนยันยกเลิกใบงาน</button><button class="btn" data-act="cancelNo">ไม่ยกเลิก</button></div></div>
  <section class="card">
    <dl class="kv">
      <dt>อุปกรณ์</dt><dd>${w.equipment?`<span class="mono">${esc(w.equipment.asset_code)}</span> · ${esc(w.equipment.name)}<div class="small muted">${esc([w.equipment.category,w.equipment.manufacturer,w.equipment.model].filter(Boolean).join(' · '))}</div>`:'–'}</dd>
      <dt>สถานที่</dt><dd>${esc(locLabel(w.location))}</dd>
      <dt>รายละเอียด</dt><dd style="white-space:pre-wrap">${esc(w.description||'–')}</dd>
      <dt>ผู้แจ้ง</dt><dd>${esc(w.reporter?.full_name||w.reporter_name||'–')}${w.reporter_contact?` · ${esc(w.reporter_contact)}`:''} <span class="small muted">(${SOURCE[w.source]})</span></dd>
      <dt>ทีม / ช่าง</dt><dd>${teamTag(w.team)} · ${esc(w.assignee?.full_name||'ยังไม่มอบหมาย')}</dd>
      <dt>แจ้งเมื่อ</dt><dd>${fmtDT(w.created_at)}</dd>
      <dt>SLA ตอบรับ</dt><dd>${fmtDT(w.sla_response_due)}${w.assigned_at?` · รับงาน ${fmtDT(w.assigned_at)}`:''}</dd>
      <dt>SLA ซ่อมเสร็จ</dt><dd>${fmtDT(w.sla_resolve_due)}</dd>
      <dt>เริ่มซ่อม</dt><dd>${fmtDT(w.started_at)}</dd>

      <label class="field"><span>ความเร่งด่วน</span><select class="input" id="asPrio">${prioOptions(w.priority)}</select></label>

  act('part', async()=>{ const pid=$('#ptSel').value, qty=Number($('#ptQty').value); if (!pid||!(qty>0)) return toast('เลือกอะไหล่และระบุจำนวน', true);

    try { await q(sb.from('work_order_parts').insert({work_order_id:w.id,part_id:pid,quantity_used:qty,used_by:uid()})); p.quantity_on_hand -= qty; await reload('เบิกอะไหล่แล้ว ตัดสต็อกเรียบร้อย'); } catch(e){ fail(e); } });
  act('comment', async()=>{ const c=$('#cmText').value.trim(); if (!c) return; try { await q(sb.from('work_order_events').insert({work_order_id:w.id,actor_id:uid(),event_type:'comment',comment:c})); await openWO(w.id); } catch(e){ fail(e); } });
  $('#cmText').onkeydown = e => { if (e.key==='Enter') $('[data-act="comment"]',body).click(); };
  const at=$('#asTeam'); if (at) at.onchange = ()=>{ const cur=$('#asTech').value; $('#asTech').innerHTML = techOptions(cur, at.value); };
}

function slaFor(priority, team){
  const pol = (S.sla||[]).find(x=>x.priority===priority && x.team_id===team) || (S.sla||[]).find(x=>x.priority===priority && !x.team_id);
  return pol ? `SLA อัตโนมัติ: <b>ต้องรับงานภายใน ${dur(Number(pol.response_hours))} · ซ่อมเสร็จภายใน ${dur(Number(pol.resolve_hours))}</b>` : 'ยังไม่ได้ตั้ง SLA สำหรับความเร่งด่วนนี้';
}

/* ============ PM ============ */
const pmFilter = { term:'', team:'', rec:'', st:'', quick:'' };
PAGES.pm = async () => {
  const f = pmFilter;
  const t0 = today(), t7 = today(7), mStart = t0.slice(0,8)+'01';
  const mStartIso = new Date(mStart+'T00:00:00+07:00').toISOString();
  const [{data:plans},{data:pmw}] = await Promise.all([
    q(sb.from('pm_schedules').select('*,equipment:equipment_id(id,asset_code,name,location:location_id(name)),assignee:profiles!pm_schedules_default_assignee_fkey(full_name),team:team_id(id,name,color)').order('next_due_date')),
    q(sb.from('work_orders').select('id,pm_schedule_id,status,due_date,completed_at').eq('source','pm').neq('status','cancelled').or(`status.in.(new,assigned,in_progress,on_hold),completed_at.gte.${new Date(Date.now()-400*864e5).toISOString()},due_date.gte.${mStartIso}`).limit(10000))
  ]);
  const dayOf = t => t ? new Date(t).toLocaleDateString('en-CA',{timeZone:TZ}) : null;
  const lastDone = {}; const openBy = {};
  pmw.forEach(w=>{ if (w.completed_at && (!lastDone[w.pm_schedule_id] || w.completed_at > lastDone[w.pm_schedule_id])) lastDone[w.pm_schedule_id] = w.completed_at;
    if (OPEN.includes(w.status)) (openBy[w.pm_schedule_id] = openBy[w.pm_schedule_id]||[]).push(w); });
  const active = plans.filter(p=>p.active);
  const todayW = pmw.filter(w=>dayOf(w.due_date)===t0);
  const overdueW = pmw.filter(w=>OPEN.includes(w.status) && w.due_date && dayOf(w.due_date) < t0);
  const overduePlans = active.filter(p=>p.next_due_date < t0);
  const overdueN = overdueW.length + overduePlans.length;
  const due7 = active.filter(p=>p.next_due_date >= t0 && p.next_due_date <= t7).length;
  const closedMonth = pmw.filter(w=>w.completed_at && dayOf(w.completed_at) >= mStart).length;
  const dueMonth = pmw.filter(w=>w.due_date && dayOf(w.due_date) >= mStart && dayOf(w.due_date) <= t0);
  const compliance = dueMonth.length ? dueMonth.filter(w=>w.completed_at && w.completed_at <= w.due_date).length / dueMonth.length * 100 : null;
  const planState = p => !p.active ? 'off' : (openBy[p.id]?.some(w=>dayOf(w.due_date) < t0) || p.next_due_date < t0) ? 'overdue' : p.next_due_date <= t7 ? 'soon' : 'on';
  let rows = plans.filter(p=>{
    if (f.term) { const s=f.term.toLowerCase(); if (![p.code,p.name,p.equipment?.asset_code,p.equipment?.name].some(v=>(v||'').toLowerCase().includes(s))) return false; }
    if (f.team && p.team_id !== f.team) return false;
    if (f.rec && p.recurrence_type !== f.rec) return false;
    const stt = planState(p);
    if (f.st==='active' && !p.active) return false; if (f.st==='off' && p.active) return false;
    if (f.st==='overdue' && stt!=='overdue') return false;
    if (f.quick==='overdue' && stt!=='overdue') return false;
    if (f.quick==='today' && !(openBy[p.id]||[]).some(w=>dayOf(w.due_date)===t0) && p.next_due_date!==t0) return false;
    return true; });
  const ST = { on:['เปิดใช้งาน','st-done'], soon:['ใกล้ถึงกำหนด','st-in_progress'], overdue:['เลยกำหนด','st-cancelled-bad'], off:['ปิดใช้งาน','st-closed'] };
  $('#view').innerHTML = `
  <section class="kpis">
    ${kpi('pm','แผนที่เปิดใช้งาน', `${active.length} <span class="kpi-of">/ ${plans.length}</span>`, '', 'แผนทั้งหมดในระบบ', 'accent')}
    ${kpi('check','งาน PM วันนี้', `${todayW.filter(w=>w.completed_at).length} <span class="kpi-of">/ ${todayW.length}</span>`, '', 'เสร็จแล้ว / ทั้งหมด', 'ok')}
    ${kpi('clock','เลยกำหนด', overdueN, '', `แผนยังไม่สร้างงาน ${overduePlans.length} · งานค้าง ${overdueW.length}`, overdueN?'bad':'ok')}
    ${kpi('calendar','ครบกำหนดใน 7 วัน', due7, '', 'แผนที่ต้องเตรียมงาน', 'info')}
    ${kpi('check','ปิดงานเดือนนี้', closedMonth, '', 'ใบงาน PM ที่ทำเสร็จ', 'ok')}
    ${kpi('sla','PM Compliance', compliance==null?'–':fmtN(compliance,1), compliance==null?'':'%', 'ทำเสร็จทันกำหนดในเดือนนี้', 'violet')}
  </section>
  <section class="card">
    <div class="pm-top">
      <div class="row">
        <button class="qchip ${f.quick==='today'?'on':''}" data-quick="today">${svgI('check')} งาน PM วันนี้ <b>${todayW.length}</b></button>
        <button class="qchip ${f.quick==='overdue'?'on':''}" data-quick="overdue">${svgI('clock')} เลยกำหนด <b>${overdueN}</b></button>
        <a class="qchip" href="#calendar">${svgI('calendar')} ปฏิทินงาน</a>
      </div>
      ${can('pm.manage')?`<div class="row"><button class="btn" id="pmGen" title="สร้างใบงานให้แผนที่ครบกำหนดภายใน ${S.cfg.targets.pm_ahead_days} วัน">↻ สร้างงานล่วงหน้า</button><button class="btn primary" id="pmNew">+ สร้างแผนใหม่</button></div>`:''}
    </div>
    <div class="pm-filters">
      <label class="field"><span>ค้นหา</span><input class="input" id="pf-term" placeholder="รหัสแผน / ชื่อแผน / อุปกรณ์" value="${esc(f.term)}"></label>
      <label class="field"><span>ทีม</span><select class="input" id="pf-team">${teamOptions(f.team,'ทั้งหมด')}</select></label>
      <label class="field"><span>รอบความถี่</span><select class="input" id="pf-rec"><option value="">ทั้งหมด</option>${Object.entries(RECUR).map(([k,v])=>`<option value="${k}" ${k===f.rec?'selected':''}>${v}</option>`).join('')}</select></label>
      <label class="field"><span>สถานะ</span><select class="input" id="pf-st">${[['','ทุกสถานะ'],['active','เปิดใช้งาน'],['overdue','เลยกำหนด'],['off','ปิดใช้งาน']].map(([k,v])=>`<option value="${k}" ${k===f.st?'selected':''}>${v}</option>`).join('')}</select></label>
      ${f.term||f.team||f.rec||f.st||f.quick?'<button class="btn" id="pf-clear" style="align-self:end">ล้างตัวกรอง</button>':''}
    </div>
  </section>
  <section class="card">
    <div class="card-head"><h2>พบ ${rows.length} แผน</h2><span class="small muted">เรียงตามวันครบกำหนดถัดไป</span></div>
    ${rows.length?`<div class="tbl-wrap"><table class="compact pm-tbl"><thead><tr><th>รหัสแผน</th><th>ชื่อแผน</th><th>อุปกรณ์</th><th>พื้นที่</th><th>ทีม</th><th>รอบ</th><th>เวลาโดยประมาณ</th><th>ครบกำหนดถัดไป</th><th>ทำล่าสุด</th><th>สถานะ</th><th></th></tr></thead><tbody>
    ${rows.map(p=>{ const s=planState(p); return `<tr>
      <td class="mono">${esc(p.code||'–')}</td><td style="white-space:normal;min-width:180px">${esc(p.name)}</td>
      <td>${p.equipment?`<span class="mono">${esc(p.equipment.asset_code)}</span> – ${esc(p.equipment.name)}`:'–'}</td>
      <td>${esc(p.equipment?.location?.name||'–')}</td><td>${p.team?teamTag(p.team):'<span class="muted">–</span>'}</td>
      <td><span class="pill plain">${esc(recurText(p))}</span></td><td class="mono">${fmtN(p.estimated_hours,1)} ชม.</td>
      <td class="${s==='overdue'?'sla bad':s==='soon'?'sla warn':''}">${fmtD(p.next_due_date)}</td>
      <td class="${lastDone[p.id]?'':'muted'}">${lastDone[p.id]?fmtD(lastDone[p.id]):'ยังไม่เคยทำ'}</td>
      <td><span class="pill ${ST[s][1]}">${ST[s][0]}</span></td>
      <td><div class="acts"><button class="icon-btn" data-chk="${p.id}" title="รายการตรวจเช็กและประวัติ" aria-label="รายการตรวจเช็ก">${svgI('wo')}</button>
        ${can('pm.manage')?`<button class="icon-btn" data-edit="${p.id}" title="แก้ไขแผน" aria-label="แก้ไข">${svgI('edit')}</button>
        <button class="icon-btn" data-tog="${p.id}" title="${p.active?'ปิดใช้งานแผน':'เปิดใช้งานแผน'}" aria-label="เปิด/ปิดแผน">${svgI(p.active?'eye':'eyeoff')}</button>`:''}</div></td></tr>`; }).join('')}
    </tbody></table></div>`:`<div class="empty">${plans.length?'ไม่พบแผนตามตัวกรอง':'ยังไม่มีแผน PM · กด "สร้างแผนใหม่" เพื่อเริ่มวางแผน'}</div>`}
  </section>`;
  const again = () => PAGES.pm().catch(fail);
  let tm; $('#pf-term').oninput = e => { clearTimeout(tm); tm=setTimeout(()=>{ f.term=e.target.value.trim(); PAGES.pm().then(()=>{ const i=$('#pf-term'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }).catch(fail); },300); };
  $('#pf-team').onchange = e => { f.team=e.target.value; again(); };
  $('#pf-rec').onchange = e => { f.rec=e.target.value; again(); };
  $('#pf-st').onchange = e => { f.st=e.target.value; again(); };
  if ($('#pf-clear')) $('#pf-clear').onclick = () => { Object.assign(f,{term:'',team:'',rec:'',st:'',quick:''}); again(); };
  $$('[data-quick]').forEach(b=>b.onclick=()=>{ f.quick = f.quick===b.dataset.quick ? '' : b.dataset.quick; again(); });
  $$('[data-edit]').forEach(b=>b.onclick=()=>pmForm(plans.find(p=>p.id===b.dataset.edit)));
  $$('[data-chk]').forEach(b=>b.onclick=()=>pmDetail(plans.find(p=>p.id===b.dataset.chk), lastDone));
  $$('[data-tog]').forEach(b=>b.onclick=async()=>{ const p=plans.find(x=>x.id===b.dataset.tog);
    try { await q(sb.from('pm_schedules').update({active:!p.active}).eq('id',p.id)); toast(p.active?'ปิดใช้งานแผนแล้ว':'เปิดใช้งานแผนแล้ว'); again(); } catch(e){ fail(e); } });
  if (can('pm.manage')) {
    $('#pmNew').onclick = () => pmForm();
    $('#pmGen').onclick = async () => { try { const {data:n}=await q(sb.rpc('generate_due_pm_work_orders',{p_days_ahead:Number(S.cfg.targets.pm_ahead_days)||0})); toast(n?`สร้างใบงาน PM ${n} รายการ`:`ไม่มีแผนที่ครบกำหนดใน ${S.cfg.targets.pm_ahead_days} วัน`); refreshOpenCount(); again(); } catch(e){ fail(e); } };
  }
};
async function pmDetail(p, lastDone){
  openPanel(`<span class="mono">${esc(p.code||'')}</span> · ${esc(p.name)}`, `${esc(recurText(p))} · ครบกำหนดถัดไป ${fmtD(p.next_due_date)}`, '<div class="loading">กำลังโหลด…</div>');
  try {
    const { data:wos } = await q(sb.from('work_orders').select(WO_SEL).eq('pm_schedule_id',p.id).order('created_at',{ascending:false}).limit(12));
    const chk = p.checklist||[];
    $('#pBody').innerHTML = `
      <section class="card"><dl class="kv">
        <dt>อุปกรณ์</dt><dd>${p.equipment?`<span class="mono">${esc(p.equipment.asset_code)}</span> · ${esc(p.equipment.name)}`:'–'}</dd>
        <dt>พื้นที่</dt><dd>${esc(p.equipment?.location?.name||'–')}</dd>
        <dt>ทีม / ช่าง</dt><dd>${p.team?teamTag(p.team):'–'} · ${esc(p.assignee?.full_name||'ไม่ระบุช่าง')}</dd>
        <dt>เวลาโดยประมาณ</dt><dd>${fmtN(p.estimated_hours,1)} ชม.</dd>
        <dt>ทำล่าสุด</dt><dd>${lastDone[p.id]?fmtDT(lastDone[p.id]):'ยังไม่เคยทำ'}</dd>
        ${p.description?`<dt>รายละเอียด</dt><dd style="white-space:pre-wrap">${esc(p.description)}</dd>`:''}
      </dl></section>
      <section class="card"><h3>รายการตรวจเช็ก (${chk.length})</h3>${chk.length?`<ol class="checklist">${chk.map(c=>`<li>${esc(typeof c==='string'?c:c.item)}</li>`).join('')}</ol>`:'<p class="muted small" style="margin:0">ยังไม่มีรายการตรวจเช็ก</p>'}</section>
      <section class="card"><h3>ใบงานจากแผนนี้</h3>${woTable(wos,false)}</section>
      ${can('pm.manage')?'<div class="row"><button class="btn" id="pdEdit">แก้ไขแผน</button></div>':''}`;

/* ============ EQUIPMENT IMPORT (Excel) ============ */
const IMPORT_COLS = [
  ['purchase_date', /install\s*date|วันที่ติดตั้ง|purchase\s*date|วันที่ซื้อ/i],
  ['asset_number', /asset\s*(no|number)|หมายเลขสินทรัพย์|เลขทะเบียนสินทรัพย์/i],
  ['asset_code', /m\/c|machine\s*(no|number|code)|หมายเลขเครื่อง|รหัสทรัพย์สิน|รหัสอุปกรณ์|asset.?code|equipment.?code/i],
  ['po_number', /purchase\s*order|ใบสั่งซื้อ|^\s*p\.?o\.?\b/i],
  ['serial_number', /serial|s\/n/i],
  ['name', /machine\s*name|equipment\s*name|ชื่อเครื่อง|ชื่ออุปกรณ์|^\s*name\s*$/i],
  ['model', /model|spec|รุ่น/i],
  ['manufacturer', /manufacturer|brand|ยี่ห้อ/i],
  ['supplier', /supplier|vend|ผู้ขาย|ผู้ผลิต/i],
  ['cost', /cost|ค่าใช้จ่าย|ราคา/i],
  ['category', /category|ประเภท|หมวด/i],
  ['remark', /remark|หมายเหตุ|note/i],
  ['location', /install|สถานที่|พื้นที่|location|area/i],
];
const CAT_KEYS = [[/pump/i,'Pump'],[/compressor/i,'Compressor'],[/desiccant|air\s*dryer/i,'Compressor'],[/chiller/i,'HVAC'],[/boiler|burner|deaerator/i,'Boiler'],[/fan|ventilat|ahu|blower/i,'Ventilation'],
  [/generator|substation|electrical|mdb|swg|transformer/i,'Electrical'],[/agitator|mixer/i,'Agitator'],[/tank|vessel|tower/i,'Tank / Vessel'],[/membrane/i,'membrane'],[/fire/i,'Fire Protection'],[/motor/i,'Motor'],[/crane|hoist/i,'Crane / Hoist'],[/lift|elevator/i,'Elevator / Lift']];
function importCell(v){ if (v==null) return ''; if (v instanceof Date) return v; return String(v).replace(/\s+/g,' ').trim(); }
function importDate(v){
  if (v instanceof Date && !isNaN(v)) return { date: `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`, extra:'' };
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v-25569)*864e5)); return importDate(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v||'').trim(); if (!s) return { date:null, extra:'' };
  const m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return { date:null, extra:s };
  let y = Number(m[3]); if (y < 100) y = y >= 40 ? 2500 + y : 2000 + y; if (y > 2400) y -= 543;
  const d = Number(m[1]), mo = Number(m[2]); if (mo<1||mo>12||d<1||d>31) return { date:null, extra:s };
  const rest = s.replace(m[0],'').trim();
  return { date:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`, extra: rest ? s : '' };
}
function importBrand(model){
  if (!model) return '';
  let m = model.match(/^([^\/]{2,30}?)\s*\/\s+/); if (m && !/\d{2,}/.test(m[1])) return m[1].trim();
  m = model.match(/^([A-Za-z][\w\-]*)\s+(oil|model|type)\b/i); if (m) return m[1];
  return '';
}
function parseEquipmentRows(aoa, opts={}){
  const typeNames = opts.typeNames || [];
  let hi = aoa.findIndex(r => r.some(c => /machine\s*name|equipment\s*name|ชื่อเครื่อง|ชื่ออุปกรณ์/i.test(String(c||''))));
  if (hi < 0) throw new Error('ไม่พบแถวหัวตาราง ต้องมีคอลัมน์ "ชื่อเครื่องจักร" หรือ "MACHINE NAME"');
  const heads = aoa[hi].map(c=>String(c||''));
  let start = hi + 1;
  const next = aoa[hi+1] || [];
  if (next.some(c => /machine\s*name|m\/c|install|model/i.test(String(c||'')))) { next.forEach((c,i)=>{ heads[i] = (heads[i]||'')+' '+String(c||''); }); start = hi + 2; }
  const map = {}; const used = new Set();
  heads.forEach((h,i)=>{ for (const [k,re] of IMPORT_COLS) { if (!used.has(k) && re.test(h)) { map[i]=k; used.add(k); break; } } });
  if (!used.has('name')) throw new Error('ไม่พบคอลัมน์ชื่อเครื่องจักร');
  const out = [];
  for (let r = start; r < aoa.length; r++) {
    const row = aoa[r]; if (!row || row.every(c => importCell(c)==='')) continue;
    const o = { _row: r+1 }; const notes = [];
    Object.entries(map).forEach(([i,k]) => { o[k] = importCell(row[i]); });
    const remark = o.remark || ''; delete o.remark;
    if (/critical/i.test(remark)) o.criticality='critical'; else if (/core/i.test(remark)) o.criticality='core'; else if (/general/i.test(remark)) o.criticality='general'; else if (remark) notes.push(remark);
    if (o.purchase_date !== undefined) { const d = importDate(o.purchase_date); o.purchase_date = d.date; if (d.extra) notes.push('วันที่ติดตั้ง (จากไฟล์): '+d.extra); }
    if (!o.manufacturer) o.manufacturer = importBrand(o.model);
    if (!o.category) { const hit = CAT_KEYS.find(([re]) => re.test(o.name||'')); if (hit && (!typeNames.length || typeNames.includes(hit[1]))) o.category = hit[1]; }
    if (opts.source) notes.push(`[ที่มา: ${opts.source}]`);
    o.notes = notes.join(' | ');
    for (const k in o) if (o[k] instanceof Date) o[k] = String(o[k]);
    out.push(o);
  }
  if (opts.autoCode) assignAutoCodes(out, opts.existingCodes);
  return { rows: out, columns: Object.values(map) };
}
function assignAutoCodes(out, existingCodes){
    const codes = new Set(out.map(o=>o.asset_code).filter(Boolean).concat(existingCodes||[]));
    out.filter(o=>!o.asset_code).forEach(o=>{
      const sib = out.filter(x=>x.asset_code && x.location===o.location).map(x=>x.asset_code.split('-')[0]);
      const pre = sib.sort((a,b)=>sib.filter(x=>x===b).length - sib.filter(x=>x===a).length)[0] || 'EQ';
      const abbr = (o.name||'X').split(/[\s\-.]+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3) || 'X';
      let n = 1, c; do { c = `${pre}-${abbr}-${String(n).padStart(2,'0')}`; n++; } while (codes.has(c));
      codes.add(c); o.asset_code = c; o._generated = true;
    });
}

const CRIT = { critical:['Critical','วิกฤต','crit-c'], core:['Core','หลัก','crit-o'], general:['General','ทั่วไป','crit-g'] };

/* ============ CALENDAR ============ */
let calMonth = null;
function addRecur(d, type, n){
  const x = new Date(d);
  if (type==='daily'||type==='custom_days') x.setDate(x.getDate()+n);
  else if (type==='weekly') x.setDate(x.getDate()+7*n);
  else if (type==='monthly') x.setMonth(x.getMonth()+n);
  else if (type==='quarterly') x.setMonth(x.getMonth()+3*n);
  else if (type==='yearly') x.setFullYear(x.getFullYear()+n);
  else x.setMonth(x.getMonth()+1);
  return x;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
PAGES.calendar = async () => {
  if (!calMonth) { const t=new Date(today()+'T00:00:00'); calMonth = new Date(t.getFullYear(), t.getMonth(), 1); }
  const m0 = new Date(calMonth), m1 = new Date(m0.getFullYear(), m0.getMonth()+1, 1);
  const [{data:pms},{data:wos}] = await Promise.all([
    q(sb.from('pm_schedules').select('id,name,next_due_date,recurrence_type,recurrence_interval,equipment:equipment_id(asset_code)').eq('active',true)),
    q(sb.from('work_orders').select('id,code,title,status,priority,due_date,source').neq('status','cancelled').gte('due_date', new Date(m0.getTime()-7*3600e3).toISOString()).lt('due_date', new Date(m1.getTime()-7*3600e3).toISOString()).limit(2000))
  ]);
  const ev = {}; const push = (k,e) => (ev[k] = ev[k]||[]).push(e);
  (wos||[]).forEach(w=>push(new Date(w.due_date).toLocaleDateString('en-CA',{timeZone:TZ}), {t:'wo', w}));
  (pms||[]).forEach(p=>{ let d = new Date(p.next_due_date+'T00:00:00'); let guard=0;

function downloadCsv(name, rows){
  const csv = '﻿' + rows.map(r=>r.map(v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('ดาวน์โหลด '+name);
}

let alertTimer = null;
async function refreshAlerts(){
  const el = $('#bellCount'); if (!el) return;
  const n = S.cfg.notify, now = new Date().toISOString(), items = [];
  const base = () => { let x = sb.from('work_orders').select('id,code,title,priority,created_at,due_date,equipment_down,assigned_to').in('status',OPEN); if (isTech()) x = x.or(`assigned_to.eq.${uid()},assigned_to.is.null`); return x; };
  const jobs = [];
  if (n.urgent) jobs.push(base().eq('priority','urgent').limit(20).then(r=>(r.data||[]).forEach(w=>items.push({k:'urgent',t:`งานด่วนมาก ${w.code}`,d:w.title,wo:w.id,at:w.created_at}))));
  if (n.equipment_down) jobs.push(base().eq('equipment_down',true).limit(20).then(r=>(r.data||[]).forEach(w=>items.push({k:'down',t:`เครื่องหยุด ${w.code}`,d:w.title,wo:w.id,at:w.created_at}))));
  if (n.overdue) jobs.push(base().lt('due_date',now).limit(20).then(r=>(r.data||[]).forEach(w=>items.push({k:'overdue',t:`เกินกำหนด ${w.code}`,d:w.title,wo:w.id,at:w.due_date}))));
  if (n.unassigned && can('wo.assign')) jobs.push(sb.from('work_orders').select('id,code,title,created_at').in('status',OPEN).is('assigned_to',null).lt('created_at', new Date(Date.now()-(n.unassigned_minutes||30)*6e4).toISOString()).limit(20)
      .then(r=>(r.data||[]).forEach(w=>items.push({k:'unassigned',t:`ยังไม่มอบหมาย ${w.code}`,d:`${w.title} · รอมาแล้ว ${timeAgo(w.created_at)}`,wo:w.id,at:w.created_at}))));
  if (n.low_stock && (can('part.view')||can('part.manage'))) jobs.push(sb.from('spare_parts').select('id,part_code,name,quantity_on_hand,reorder_point,unit').then(r=>(r.data||[]).filter(p=>Number(p.quantity_on_hand)<=Number(p.reorder_point)).forEach(p=>items.push({k:'stock',t:`อะไหล่ใกล้หมด ${p.part_code}`,d:`${p.name} คงเหลือ ${fmtN(p.quantity_on_hand,2)} ${p.unit}`,href:'#parts'}))));
  if (n.pm_due && (can('pm.view')||can('pm.manage'))) jobs.push(sb.from('pm_schedules').select('id,name,next_due_date').eq('active',true).lte('next_due_date',today()).limit(20).then(r=>(r.data||[]).forEach(p=>items.push({k:'pm',t:`PM ถึงกำหนด`,d:`${p.name} · ${fmtD(p.next_due_date)}`,href:'#pm'}))));
  await Promise.allSettled(jobs);
  const seen = new Set(); const list = items.filter(i=>{ const key=(i.wo||i.href)+i.k; if (seen.has(key)) return false; seen.add(key); return true; });
  const order = {down:0,urgent:1,overdue:2,unassigned:3,pm:4,stock:5}; list.sort((a,b)=>order[a.k]-order[b.k]);
  S.alerts = list; el.hidden = !list.length; el.textContent = list.length>99?'99+':list.length;
  if (!$('#bellPanel').hidden) paintBell();
}

    bindForm();
    $$('[data-medit]').forEach(b=>b.onclick=()=>{ editing=rows.find(r=>r.id===b.dataset.medit); $('#mdSide').innerHTML = formHTML(editing); bindForm(); $('#md-name').focus(); });
    $$('[data-mtog]').forEach(b=>b.onclick=async()=>{ const r=rows.find(x=>x.id===b.dataset.mtog);
      try { await q(sb.from(DEF.table).update({active: r.active===false}).eq('id',r.id)); await loadRefs(); toast(r.active===false?'เปิดใช้งานแล้ว':'ปิดใช้งานแล้ว'); again(); } catch(err){ fail(err); } });
  }

  else if (settingsTab==='system') {
    const t0 = performance.now(); const { data:i } = await q(sb.rpc('get_system_info')); const ping = Math.round(performance.now()-t0);
    const kv = [['อุปกรณ์',i.equipment],['พื้นที่',i.locations],['ใบงานทั้งหมด',i.work_orders],['ใบงานค้าง',i.work_orders_open],['แผน PM',i.pm_plans],['รายการอะไหล่',i.spare_parts],['ผู้ใช้ (ใช้งานได้/ทั้งหมด)',`${i.users_active} / ${i.users}`],['ทีม',i.teams],['ประวัติการทำงาน',i.events]];
    B.innerHTML = `<div class="set-grid">
      <section class="card"><h2>สถานะระบบ</h2>
        <div class="set-status"><span class="dot-ok"></span><div><b>ระบบทำงานปกติ</b><div class="small muted">ตอบสนองภายใน ${ping} มิลลิวินาที · เวลาเซิร์ฟเวอร์ ${fmtDT(i.server_time)}</div></div></div>
        <dl class="kv"><dt>เวอร์ชันแอป</dt><dd class="mono">${APP_VERSION}</dd><dt>ฐานข้อมูล</dt><dd>Supabase · PostgreSQL ${esc(i.pg_version)}</dd><dt>โปรเจกต์</dt><dd class="mono">${esc(SB_URL.replace('https://',''))}</dd>
          <dt>ขนาดฐานข้อมูล</dt><dd class="mono">${esc(i.db_size)}</dd><dt>อัปเดตใบงานล่าสุด</dt><dd>${fmtDT(i.last_wo)}</dd><dt>ผู้ใช้ปัจจุบัน</dt><dd>${esc(S.profile.full_name)} (${ROLE[role()]})</dd></dl>
        <div class="row"><button class="btn" id="sysRe">ตรวจสอบอีกครั้ง</button></div></section>
      <section class="card"><h2>จำนวนข้อมูลในระบบ</h2>
        <div class="sys-grid">${kv.map(([l,v])=>`<div><span class="small muted">${l}</span><b class="mono">${typeof v==='number'?fmtN(v,0):esc(v)}</b></div>`).join('')}</div>
        <div class="row"><button class="btn" id="expEq">ดาวน์โหลดทะเบียนอุปกรณ์ (CSV)</button><button class="btn" id="expPt">ดาวน์โหลดรายการอะไหล่ (CSV)</button></div></section></div>`;
    $('#sysRe').onclick=again;
    $('#expEq').onclick=async()=>{ try { const {data}=await q(sb.from('equipment').select('asset_code,name,category,status,manufacturer,model,serial_number,purchase_date,warranty_expiry,notes,location:location_id(name)').order('asset_code').limit(20000));
      downloadCsv(`equipment-${today()}.csv`, [['รหัสทรัพย์สิน','ชื่อ','หมวด','สถานะ','ยี่ห้อ','รุ่น','Serial','วันที่ซื้อ','ประกันถึง','พื้นที่','หมายเหตุ'], ...data.map(e=>[e.asset_code,e.name,e.category,e.status,e.manufacturer,e.model,e.serial_number,e.purchase_date,e.warranty_expiry,e.location?.name,e.notes])]); } catch(e){ fail(e); } };
    $('#expPt').onclick=async()=>{ try { const {data}=await q(sb.from('spare_parts').select('*').order('part_code'));
      downloadCsv(`spare-parts-${today()}.csv`, [['รหัส','ชื่อ','หน่วย','คงเหลือ','จุดสั่งซื้อ','ราคา/หน่วย','ที่เก็บ','ผู้จำหน่าย'], ...data.map(p=>[p.part_code,p.name,p.unit,p.quantity_on_hand,p.reorder_point,p.unit_cost,p.storage_location,p.supplier])]); } catch(e){ fail(e); } };
  }

  else if (settingsTab==='users') await usersPage(B);
};

const userFilter = { term:'', role:'', st:'' };
async function usersPage(B){
  const again = () => PAGES.settings().catch(fail);
  const [{data:people},{data:auth},{data:perms},{data:open}] = await Promise.all([
    q(sb.from('profiles').select('*').order('full_name')), q(sb.rpc('admin_list_users')), q(sb.from('role_permissions').select('*')),
    q(sb.from('work_orders').select('assigned_to').in('status',OPEN).not('assigned_to','is',null).limit(10000)) ]);
  S.people = people;
  const A = Object.fromEntries((auth||[]).map(a=>[a.id,a]));
  const openBy = {}; (open||[]).forEach(w=>openBy[w.assigned_to]=(openBy[w.assigned_to]||0)+1);
  const since30 = Date.now()-30*864e5;
  const f = userFilter;
  const rows = people.filter(p=>(!f.role||p.role===f.role) && (!f.st||(f.st==='on'?p.active:!p.active))
    && (!f.term || [p.username,p.full_name,A[p.id]?.email,p.position].some(v=>(v||'').toLowerCase().includes(f.term.toLowerCase()))));
  const RC = { admin:'st-cancelled-bad', manager:'st-in_progress', supervisor:'st-assigned', technician:'st-new', reporter:'st-closed' };
  const roleCount = r => people.filter(p=>p.role===r).length;
  const pr = new Set(perms.filter(x=>x.role===permRole).map(x=>x.perm));
  B.innerHTML = `
  <section class="kpis k4">
    ${kpi('tech','ผู้ใช้ทั้งหมด', people.length, '', 'บัญชีในระบบ', 'accent')}
    ${kpi('check','บัญชีที่ใช้งานได้', people.filter(p=>p.active).length, '', `ปิดใช้งาน ${people.filter(p=>!p.active).length} บัญชี`, 'ok')}
    ${kpi('pulse','ล็อกอินใน 30 วัน', people.filter(p=>A[p.id]?.last_sign_in_at && new Date(A[p.id].last_sign_in_at).getTime()>=since30).length, '', 'ผู้ใช้ที่เข้าระบบล่าสุด', 'info')}
    ${kpi('sla','บทบาททั้งหมด', ROLE_ORDER.length, '', 'ปรับสิทธิ์ได้ด้านล่าง', 'violet')}
  </section>
  <section class="card">
    <div class="card-head"><h2>พบ ${rows.length} บัญชี</h2><button class="btn primary sm" id="uAdd">+ เพิ่มผู้ใช้</button></div>
    <div class="pm-filters uf">
      <label class="field"><span>ค้นหา</span><input class="input" id="uf-term" placeholder="ชื่อผู้ใช้ / ชื่อ / อีเมล" value="${esc(f.term)}"></label>
      <label class="field"><span>บทบาท</span><select class="input" id="uf-role"><option value="">ทั้งหมด</option>${ROLE_ORDER.map(r=>`<option value="${r}" ${r===f.role?'selected':''}>${ROLE[r]}</option>`).join('')}</select></label>
      <label class="field"><span>สถานะ</span><select class="input" id="uf-st"><option value="">ทั้งหมด</option><option value="on" ${f.st==='on'?'selected':''}>ใช้งาน</option><option value="off" ${f.st==='off'?'selected':''}>ปิดใช้งาน</option></select></label>
      ${f.term||f.role||f.st?'<button class="btn" id="uf-clear" style="align-self:end">ล้างตัวกรอง</button>':''}
    </div>
    <div class="tbl-wrap"><table class="compact"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ-นามสกุล</th><th>ตำแหน่ง</th><th>บทบาท</th><th>ทีม</th><th>อีเมล</th><th class="num">งานค้าง</th><th>ล็อกอินล่าสุด</th><th>สถานะ</th><th></th></tr></thead><tbody>
    ${rows.map(p=>{ const a=A[p.id]; const internal=(a?.email||'').endsWith('@mms.internal'); return `<tr class="${p.active?'':'is-off'}">
      <td class="mono">${esc(p.username)}${p.id===uid()?' <span class="pill st-new plain">คุณ</span>':''}</td><td>${esc(p.full_name)}</td><td>${esc(p.position||'–')}</td>
      <td><span class="pill plain ${RC[p.role]}">${ROLE[p.role]}</span></td><td>${esc(S.teams.find(t=>t.id===p.team_id)?.name||'–')}</td>
      <td class="small ${internal?'muted':''}">${internal?'–':esc(a?.email||'–')}</td><td class="num mono">${openBy[p.id]||0}</td>
      <td class="small">${a?.last_sign_in_at?fmtDT(a.last_sign_in_at):'<span class="muted">ยังไม่เคย</span>'}</td>
      <td><span class="pill ${p.active?'st-done':'st-closed'}">${p.active?'ใช้งาน':'ปิดใช้งาน'}</span></td>
      <td><div class="acts"><button class="icon-btn" data-uedit="${p.id}" title="แก้ไขข้อมูลและสิทธิ์">${svgI('edit')}</button><button class="icon-btn" data-upw="${p.id}" title="ตั้งรหัสผ่านใหม่">${svgI('key')}</button></div></td></tr>`; }).join('')}
    </tbody></table></div>
  </section>
  <section class="card">
    <div class="card-head"><div><h2>สิทธิ์ตามบทบาท</h2><p class="small muted" style="margin:4px 0 0">กำลังแก้ไขสิทธิ์ของบทบาท <b style="color:var(--accent)">${ROLE[permRole]}</b> — มีผู้ใช้ ${roleCount(permRole)} คน</p></div>
      <div class="row">${ROLE_ORDER.map(r=>`<button class="qchip ${permRole===r?'on':''}" data-prole="${r}">${ROLE[r]} <b>${roleCount(r)}</b></button>`).join('')}</div></div>
    ${permRole==='admin'?'<div class="note">ผู้ดูแลระบบมีสิทธิ์ทั้งหมดเสมอ และแก้ไขไม่ได้ เพื่อป้องกันไม่ให้ระบบไม่มีผู้ดูแล</div>':''}
    <div class="perm-grid">${PERM_GROUPS.map(([g,list])=>`<div class="perm-box"><h3>${g}</h3>${list.map(([k,l])=>`<label class="perm-row"><span class="check"><input type="checkbox" data-perm="${k}" ${permRole==='admin'||pr.has(k)?'checked':''} ${permRole==='admin'?'disabled':''}> ${l}</span><code>${k}</code></label>`).join('')}</div>`).join('')}</div>
    ${permRole!=='admin'?`<div class="row"><button class="btn primary" id="permSave">${svgI('check')} บันทึกสิทธิ์ของบทบาทนี้</button><span class="small muted">มีผลทันทีกับผู้ใช้ในบทบาทนี้ (ผู้ใช้ต้องรีเฟรชหน้าเว็บ)</span></div>`:''}
  </section>`;
  let tm; $('#uf-term').oninput=e=>{ clearTimeout(tm); tm=setTimeout(()=>{ f.term=e.target.value.trim(); again().then(()=>{ const i=$('#uf-term'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }); },300); };
  $('#uf-role').onchange=e=>{ f.role=e.target.value; again(); };
  $('#uf-st').onchange=e=>{ f.st=e.target.value; again(); };
  if ($('#uf-clear')) $('#uf-clear').onclick=()=>{ Object.assign(f,{term:'',role:'',st:''}); again(); };
  $('#uAdd').onclick=()=>techForm();
  $$('[data-uedit]').forEach(b=>b.onclick=()=>{ const p=people.find(x=>x.id===b.dataset.uedit); techDetail({p,open:openBy[p.id]||0,over:0,done30:0,mttr:null}); });
  $$('[data-upw]').forEach(b=>b.onclick=()=>{ const p=people.find(x=>x.id===b.dataset.upw);
    openPanel('ตั้งรหัสผ่านใหม่', `${esc(p.full_name)} · <span class="mono">${esc(p.username)}</span>`, `<form class="card" id="pwForm"><label class="field"><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</span><input class="input mono" id="pw-new" minlength="8" required autocomplete="new-password"></label><div class="row"><button class="btn primary">ตั้งรหัสผ่าน</button></div></form>`);
    $('#pwForm').onsubmit=async e=>{ e.preventDefault(); try { await q(sb.rpc('admin_set_password',{p_user:p.id,p_password:$('#pw-new').value})); closePanel(); toast('ตั้งรหัสผ่านใหม่แล้ว'); } catch(err){ fail(err); } }; });
  $$('[data-prole]').forEach(b=>b.onclick=()=>{ permRole=b.dataset.prole; again(); });
  if ($('#permSave')) $('#permSave').onclick=async()=>{ const list=$$('[data-perm]').filter(i=>i.checked).map(i=>i.dataset.perm);
    try { await q(sb.rpc('set_role_permissions',{p_role:permRole,p_perms:list})); toast(`บันทึกสิทธิ์ของ ${ROLE[permRole]} แล้ว`); again(); } catch(err){ fail(err); } };
}

window.onhashchange = () => { if (!S.profile) boot(); };
boot();
</script>
</body>
</html>
